<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="11 type OL">
<title>Notre 11 type OL</title>
<style>
:root{--bleu:#13306b;--bleu2:#1d4aa0;--rouge:#d3122d;--fond:#0b1530;--carte:#16244a;--txt:#eef2ff;--mute:#9fb0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fond);color:var(--txt);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:38px 16px 6px;text-align:center;position:relative}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 span{color:var(--rouge)}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.who{position:absolute;right:12px;top:8px;font-size:12px;color:var(--mute);background:var(--carte);border:1px solid #2b3c6e;border-radius:999px;padding:5px 10px;cursor:pointer}
.sync{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
.sync.ok{color:#7ee2a0}.sync.err{color:#ffb38a}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid #2b3c6e;background:var(--carte);color:var(--txt);font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--bleu2);border-color:#5d86e0}
.tab small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tab.on small{color:#d6e2ff}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
.bar{display:flex;gap:8px;align-items:center;margin:8px 4px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--mute)}
select,input[type=search]{background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:9px 10px;font-size:16px}
.btn{background:var(--rouge);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #2b3c6e;color:var(--mute)}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:14px;overflow:hidden;margin-top:6px;
 background:repeating-linear-gradient(180deg,#1f7a3a 0 10%,#1b6e34 10% 20%);box-shadow:0 6px 24px #0008}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;border:0;background:none;padding:0;color:#fff;font:inherit}
.shirt{width:44px;height:44px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--bleu2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--bleu);box-shadow:0 2px 6px #0007;position:relative;overflow:hidden}
.shirt::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--rouge) 40% 50%,var(--bleu2) 50% 60%,transparent 60%);opacity:.9}
.shirt b{position:relative;background:#fff;border-radius:6px;padding:0 3px}
.empty .shirt{background:#ffffff22;border:2px dashed #ffffffaa;color:#fff}
.empty .shirt::before{display:none}
.empty .shirt b{background:none;color:#fff}
.nm{margin-top:3px;font-size:11.5px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px #000;background:#0009;border-radius:6px;padding:2px 4px;display:inline-block;max-width:84px}
.ro{cursor:default}
.save{display:block;width:100%;padding:14px;font-size:16px;margin:4px 0 2px;border-radius:12px}
.save.done{background:#1f8a4c}
.saved{text-align:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.lib .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #24345f}
.lib .it:first-child{border-top:0}
.lib .it .info{flex:1;min-width:0}
.lib .it .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .it .info small{color:var(--mute);font-size:12px}
.lib .it.cur .info b{color:#7ee2a0}
.sm{font-size:12.5px;padding:7px 9px;border-radius:9px}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:#101c3d;border:1px solid #2b3c6e;border-radius:16px;padding:16px;width:100%;max-width:380px}
.mbox h3{margin:0 0 12px;font-size:17px}
.mbox input{width:100%;background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:11px;font-size:16px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mbtns .btn{padding:12px;font-size:15px}
.sbar{display:flex;align-items:center;gap:8px;margin:7px 0}
.sbar .sv{width:30px;text-align:center;font-weight:800;font-size:14px}
.sbar .sl{flex:1}
.sbar .sl span{display:block;text-align:center;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.track{height:8px;border-radius:6px;background:var(--bleu2);overflow:hidden}
.track i{display:block;height:100%;background:var(--rouge)}
.vs{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:12px 4px 2px}
.vs b{color:var(--txt)}
.score{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:center}
.score .tm{flex:1;font-weight:800;font-size:17px}
.score .tm small,.score .sc small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
.score .sc{font-size:38px;font-weight:900;min-width:120px;letter-spacing:2px}
.feed{max-height:260px;overflow-y:auto;margin-top:10px;border-top:1px solid #24345f}
.ev{display:flex;gap:8px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid #1d2b55}
.ev b{min-width:30px;color:var(--mute)}
.ev.goal{background:#1f8a4c33;border-radius:8px}
.ev.red{background:#b4432b33;border-radius:8px}
.mute{color:var(--mute)}
.motm{margin:12px 0 6px;padding:10px;border-radius:10px;background:#c9a22722;color:#ffd970;font-size:14px;text-align:center}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes h4{margin:8px 0 4px;font-size:13px;color:var(--mute)}
.nr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #1d2b55}
.nr .hi{color:#7ee2a0}.nr .lo{color:#ff9aa8}
.psel{max-width:42%;font-weight:700}
.vsmid{text-align:center;font-weight:900;color:var(--rouge);margin:-4px 0}
.rk{display:grid;grid-template-columns:24px 1fr 30px 30px 30px 40px;gap:4px;font-size:14px;padding:7px 4px;border-top:1px solid #24345f;text-align:center}
.rk span:nth-child(2){text-align:left;font-weight:700}
.rk.head{color:var(--mute);font-size:12px;border-top:0}
.rk.me{background:#1d4aa033;border-radius:8px}
.tally{display:flex;gap:8px;margin-bottom:8px}
.tally div{flex:1;text-align:center;background:#0f1d40;border-radius:10px;padding:8px;font-size:12px;color:var(--mute)}
.tally b{display:block;font-size:24px;color:var(--txt)}
.fcard{--w:160px;width:var(--w);height:calc(var(--w)*1.42);position:relative;font-size:calc(var(--w)/10);color:#4a3606;clip-path:polygon(50% 0,100% 7%,100% 85%,50% 100%,0 85%,0 7%);background:linear-gradient(155deg,#fff6c2 0%,#ecc95f 30%,#c39531 62%,#f3d77a 100%);overflow:hidden;flex:none;font-family:system-ui,-apple-system,sans-serif;text-align:left}
.fcard.silver{background:linear-gradient(155deg,#ffffff,#d5dae1 35%,#97a1ad 70%,#e6eaef);color:#263038}
.fcard.bronze{background:linear-gradient(155deg,#f9d6b3,#cf915a 40%,#8d5627 75%,#e2a774);color:#2f1806}
.fcard.icon{background:linear-gradient(155deg,#fffdf5,#f0e5c4 35%,#cdb67c 70%,#fff4d2);color:#3d2d06}
.fcard.icon::before{content:"";position:absolute;inset:4%;clip-path:inherit;border:calc(var(--w)/70) solid #b8954166}
.fcard.myth{background:linear-gradient(155deg,#2a1240,#5b1e7a 30%,#1a0b2e 60%,#d7a8ff 100%);color:#ffe7a3}
.fcard.myth::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#ff6ad533,#6ad5ff33,#ffe76a33,#ff6ad533);mix-blend-mode:screen;animation:spin 6s linear infinite}
.fcard.myth .fc-shine{background:linear-gradient(115deg,transparent 30%,#ffe7a3aa 48%,transparent 62%)}
.fcard.coach{background:linear-gradient(155deg,#2b3f78,#13306b 50%,#0b1a3d);color:#ffd970}
.fc-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff70 48%,transparent 60%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
.mini .fc-shine{display:none}
@keyframes shine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.fc-top{position:absolute;left:11%;top:10.5%;text-align:center;line-height:1;z-index:1}
.fc-ovr{font-size:2.4em;font-weight:900;letter-spacing:-.04em}
.fc-pos{font-size:.95em;font-weight:800;margin-top:.1em}
.fc-club{margin-top:.5em;font-size:.68em;font-weight:900;border:.13em solid currentColor;border-radius:.35em;padding:.15em .25em}
.fc-flag{font-size:1.05em;margin-top:.3em;line-height:1}
.fc-face{position:absolute;right:6%;top:8%;width:60%;height:48%}
.fc-face svg{width:100%;height:100%}
.fc-img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:drop-shadow(0 2px 3px #0005);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.mini .fc-face{top:26%}
.fc-name{position:absolute;top:54%;left:8%;right:8%;text-align:center;font-weight:900;font-size:1.08em;text-transform:uppercase;letter-spacing:.02em;padding-bottom:.25em;border-bottom:.07em solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-stats{position:absolute;top:65%;left:15%;right:11%;display:grid;grid-template-columns:1fr 1fr;column-gap:.6em;row-gap:0;font-size:.76em}
.fc-stats span{display:flex;gap:.35em;align-items:baseline}
.fc-stats b{font-weight:900;font-size:1.12em;min-width:1.3em}
.fc-coach{position:absolute;top:66%;left:8%;right:8%;text-align:center;font-weight:800;font-size:.85em}
.fc-coach small{display:block;font-weight:500;font-size:.8em;opacity:.8;margin-top:.3em}
.fc-tag{position:absolute;bottom:5.2%;width:100%;text-align:center;font-size:.52em;font-weight:900;letter-spacing:.15em;opacity:.6}
.mini .fc-top{left:9%;top:11%}
.mini .fc-ovr{font-size:2.6em}
.mini .fc-pos{font-size:1.15em}
.mini .fc-face{top:30%;right:0;width:100%;height:60%}
.slot.has{width:auto}
.slot.has .fcard{margin:0 auto;filter:drop-shadow(0 3px 4px #0009)}
.slot.has .nm{margin-top:2px}
.cardbtn{border:0;background:none;padding:0;margin-right:4px;cursor:pointer}
.cardm{background:#000000e6}
.cardm .cm-box{display:flex;flex-direction:column;align-items:center;max-width:320px;width:100%}
.cm-card{filter:drop-shadow(0 10px 30px #000c)}
.cm-info{text-align:center;font-size:14px;line-height:1.6;margin:14px 0 4px;color:#dfe7ff}
.cm-box .mbtns{width:100%}
.cm-palm{margin-top:8px;font-size:13px;line-height:1.5;color:#dfe7ff}
.rar{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;margin-bottom:4px;text-transform:uppercase}
.r-bronze{background:#8d5627;color:#fff}.r-silver{background:#97a1ad;color:#111}.r-gold{background:#c39531;color:#111}.r-icon{background:#f0e5c4;color:#3d2d06}.r-myth{background:linear-gradient(90deg,#ff6ad5,#6ad5ff,#ffe76a);color:#111}
.pk-rar{position:relative;font-weight:900;letter-spacing:.2em;font-size:15px;padding:5px 16px;border-radius:999px;margin-bottom:14px;text-transform:uppercase;animation:pop .5s .3s both}
.rays.myth{background:repeating-conic-gradient(#ff6ad533 0 6deg,transparent 6deg 12deg,#6ad5ff33 12deg 18deg,transparent 18deg 24deg)}
.cm-note{font-size:11px;color:var(--mute);text-align:center;margin-top:10px}
.flip-in{animation:flipIn .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flipIn{0%{transform:perspective(600px) rotateY(100deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.slide-in{animation:slideIn .45s ease-out both}
@keyframes slideIn{0%{transform:translateX(-120%) rotate(-12deg)}100%{transform:none}}
.glow{animation:flipIn .7s cubic-bezier(.2,.9,.3,1.2) both,glow 1.2s ease-in-out .7s infinite alternate}
@keyframes glow{to{filter:brightness(1.18) drop-shadow(0 0 14px #ffe48a)}}
.fx{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.fx.open{display:flex}
.fx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 70%,transparent),#000d 70%);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.fx-label{position:relative;font-size:46px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 18px var(--c),0 4px 0 #0008;letter-spacing:2px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;margin-bottom:10px}
.fx-label.save{font-size:38px}
.fx-label.motm{font-size:26px;color:#ffd970;text-shadow:0 0 16px #c9a227}
@keyframes pop{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
.fx-card{position:relative;filter:drop-shadow(0 12px 30px #000)}
.fx-sub{position:relative;color:#fff;font-weight:700;margin-top:12px;font-size:15px;animation:fade .5s .4s both}
.fx-assist{position:relative;display:flex;align-items:center;gap:10px;margin-top:12px;color:#fff;font-size:13px;animation:slideIn .5s .6s both}
.stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);border:5px solid #ff2a2a;color:#ff2a2a;font-weight:900;font-size:30px;padding:4px 12px;border-radius:8px;background:#fff9;animation:stamp .4s .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-18deg) scale(3);opacity:0}100%{opacity:1}}
.shake{animation:shake .5s .9s both}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s linear both}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(#ffd97022 0 6deg,transparent 6deg 18deg);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nr{cursor:pointer}
.coins{position:absolute;left:12px;top:8px;font-size:12px;font-weight:800;color:#ffd970;background:var(--carte);border:1px solid #6b5a1e;border-radius:999px;padding:5px 10px;cursor:pointer}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkbtn{border:0;border-radius:14px;padding:14px 6px;cursor:pointer;color:#1b1406;background:linear-gradient(160deg,#fff 0%,var(--pc) 45%,#6d4f17 120%);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px #0007;font-family:inherit}
.pkbtn.daily{width:100%;flex-direction:row;justify-content:space-between;padding:14px 16px;margin-bottom:8px;animation:glow 1.2s ease-in-out infinite alternate}
.pkbtn b{font-size:13px}.pkbtn span{font-size:10.5px;opacity:.8}.pkbtn em{font-style:normal;font-weight:900;font-size:14px;margin-top:2px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;justify-items:center}
.slotc{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.slotc .no{font-size:10px;color:var(--mute);margin-bottom:2px}
.slotc.locked .fcard{filter:grayscale(1) brightness(.35)}
.slotc .q{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffffff55}
.slotc .cnt{position:absolute;top:14px;right:2px;background:var(--rouge);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 6px}
.slotc .an{font-size:11px;color:#c8d6ff;margin-top:3px;text-align:center;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotc.locked .an{color:#6b7aa6}
.packfx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column}
.packfx.open{display:flex}
.pk-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1d4aa0,#050b1d 75%)}
.pk-pack{position:relative;width:190px;height:270px;border-radius:16px;background:linear-gradient(150deg,#fff,var(--pc) 40%,#5b4214);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1406;box-shadow:0 20px 50px #000c;cursor:pointer;animation:pkShake 1.1s ease-in-out infinite;overflow:hidden}
.pk-pack b{font-size:64px;font-weight:900;letter-spacing:-2px}.pk-pack span{font-weight:900;font-size:17px}.pk-pack small{margin-top:24px;font-size:11px;opacity:.7}
.pk-foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff9 45%,transparent 60%);animation:shine 2.2s linear infinite}
@keyframes pkShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) scale(1.02)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg) scale(1.03)}}
.pk-pack.tear{animation:pkTear .7s ease-in forwards}
@keyframes pkTear{0%{transform:scale(1)}40%{transform:scale(1.15) rotate(4deg);filter:brightness(1.6)}100%{transform:scale(2.2);opacity:0;filter:brightness(3)}}
.pk-show{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.pk-card{position:relative;filter:drop-shadow(0 14px 34px #000)}
.pk-new{position:relative;margin-top:16px;font-weight:900;font-size:22px;color:#7ee2a0;text-shadow:0 0 12px #1f8a4c;animation:pop .5s .5s both}
.pk-dup{position:relative;margin-top:16px;font-weight:700;color:var(--mute);animation:fade .5s .5s both}
.pk-hint{position:relative;margin-top:14px;font-size:12px;color:#c8d6ff;opacity:.7}
.walk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#02040c;overflow:hidden;cursor:pointer}
.wo-beam{position:absolute;left:50%;top:-10%;width:140px;height:130%;transform:translateX(-50%);background:linear-gradient(180deg,transparent,var(--wc),transparent);filter:blur(18px);opacity:0;animation:beam 1.2s .1s ease-out forwards}
.walk.gold{--wc:#ffd970}.walk.icon{--wc:#fff2c8}.walk.myth{--wc:#d07bff}
@keyframes beam{0%{opacity:0;width:4px}60%{opacity:1}100%{opacity:.85;width:180px}}
.walk.myth .wo-beam{background:linear-gradient(180deg,transparent,#ff6ad5,#6ad5ff,#ffe76a,transparent)}
.wo-stage{position:relative;text-align:center;color:#fff}
.wo-item{animation:woIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes woIn{0%{transform:scale(2.5);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
.wo-big{font-size:72px;font-weight:900;line-height:1;text-shadow:0 0 30px var(--wc)}
.wo-flag{font-size:96px}
.wo-small{margin-top:12px;font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e8eeff}
.wo-skip{position:absolute;bottom:40px}
.walk.boom{animation:boom .45s ease-in forwards}
@keyframes boom{0%{background:#02040c}50%{background:#fff}100%{opacity:0;background:#fff}}
.pk-sum{position:relative;display:flex;flex-direction:column;align-items:center;padding:16px;width:100%;max-width:420px}
.pk-sum h3{margin:0 0 12px}
.pk-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pk-mini{position:relative;animation:slideIn .4s both}
.pk-mini i{position:absolute;top:-6px;right:-4px;background:#1f8a4c;color:#fff;font-style:normal;font-weight:900;font-size:10px;border-radius:6px;padding:2px 5px}
.modes button{position:relative}
.modes button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;right:4px;background:#ffd970;color:#111;font-size:10px;font-weight:900;border-radius:999px;padding:1px 5px}
#cMarket h4{margin:12px 0 6px;font-size:13px;color:var(--mute)}
.mk{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #1d2b55}
.mkp{font-weight:900;color:#ffd970;font-size:14px;white-space:nowrap}
#cTrades h4{margin:12px 0 6px;font-size:13px;color:var(--mute)}
.trow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:#0f1d40;border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
.trow small{display:block;color:var(--mute);font-size:11px}
.tarrow{font-size:20px;color:#ffd970}
.tpts{grid-column:1/-1;font-size:11px;color:var(--mute)}
.tbtns{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tradeui{position:fixed;inset:0;z-index:45;background:#000c;display:none;align-items:flex-end;justify-content:center}
.tradeui.open{display:flex}
.tui-box{background:#101c3d;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.tui-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:17px}
.tbal{display:flex;align-items:center;justify-content:space-around;background:#0f1d40;border-radius:12px;padding:10px;margin-top:6px;text-align:center;font-size:12px;color:var(--mute)}
.tbal b{display:block;font-size:26px;color:var(--txt)}
.tbal.ok{background:#1f8a4c33;outline:2px solid #1f8a4c}
.tsym{font-size:28px;font-weight:900;color:#ffd970}
.tmsg{text-align:center;font-size:13px;margin:6px 0 4px;color:#c8d6ff}
.tui-box h4{margin:12px 0 6px;font-size:13px;color:var(--mute)}
.tline{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px}
.tline.on{background:#1d4aa033}
.tname{flex:1;font-size:14px;font-weight:600}
.tname small{display:block;font-weight:400;font-size:11px;color:var(--mute);margin-top:2px}
.tname .rar{font-size:9.5px;padding:1px 6px;margin:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid #2b3c6e;background:var(--carte);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.step button:disabled{opacity:.3}
.step b{min-width:16px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f8a4c;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 6px 20px #0008;display:none}
.count{font-size:13px;color:var(--mute);margin:8px 4px}
.section{margin-top:14px;background:var(--carte);border-radius:14px;padding:12px}
.section h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between}
.section h3 small{color:var(--mute);font-weight:400}
.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
.bench .slot,.coach .slot{position:static;transform:none;width:auto}
.bench .nm,.coach .nm{background:#0006}
.coach{display:flex;justify-content:center}
.coach .shirt{background:#1b2a55;border-color:#c9a227;color:#ffd970}
.coach .shirt::before{display:none}
.coach .shirt b{background:none;color:#ffd970}
.coach .nm{max-width:160px;font-size:13px}
.crow{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;font-size:13px;padding:6px 0;border-top:1px solid #24345f}
.crow.head{font-weight:700;border-top:0;color:var(--mute)}
.crow .p{color:var(--mute);font-weight:700}
.same{color:#7ee2a0;font-weight:700}
/* sheet */
.veil{position:fixed;inset:0;background:#000a;display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:#101c3d;border-radius:18px 18px 0 0;z-index:11;display:none;flex-direction:column;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open,.veil.open{display:flex}
.sh-head{padding:14px 16px 8px;border-bottom:1px solid #24345f}
.sh-head h2{margin:0 0 8px;font-size:17px}
.sh-head .row{display:flex;gap:8px;align-items:center}
.sh-head input{flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid #2b3c6e;background:transparent;color:var(--mute);cursor:pointer}
.chip.on{background:var(--bleu2);color:#fff;border-color:#5d86e0}
.list{overflow-y:auto;padding:6px 8px 20px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;border-radius:10px;cursor:pointer;gap:8px}
.pl:active{background:#1c2c5c}
.pl .n{font-weight:600;font-size:15px}
.yr{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:1px}
.pl .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:10.5px;padding:2px 6px;border-radius:6px;background:#24345f;color:#c8d6ff;font-weight:700}
.tag.cur{background:var(--rouge);color:#fff}
.pl.used{opacity:.4}
.tk{display:block;font-weight:600;font-size:11.5px;color:#ff9aa8;margin-top:1px}
.modes{display:flex;gap:6px;margin:6px 16px 0;background:#0f1d40;border-radius:12px;padding:4px}
.modes button{flex:1;padding-left:2px!important;padding-right:2px!important;font-size:13px!important;border:0;background:none;color:var(--mute);font-weight:700;font-size:14px;padding:9px;border-radius:9px;cursor:pointer}
.modes button.on{background:var(--rouge);color:#fff}
.dbanner{margin:10px 0 4px;padding:14px;border-radius:14px;text-align:center;font-weight:800;font-size:18px;background:var(--carte)}
.dbanner.me{background:linear-gradient(90deg,#d3122d,#1d4aa0);animation:pulse 1.4s ease-in-out infinite}
.dbanner small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:3px}
@keyframes pulse{50%{filter:brightness(1.25)}}
.field{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.field span{font-size:14px;color:var(--mute)}
.rules{font-size:13px;color:#c8d6ff;line-height:1.5;margin:10px 0}
.logrow{font-size:13px;padding:6px 0;border-top:1px solid #24345f;display:flex;gap:8px}
.logrow b{color:var(--mute);min-width:26px}
.big{display:block;width:100%;padding:15px;font-size:16px;border-radius:12px;margin-top:10px}
/* accueil */
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 20%,#1d4aa0 0,#0b1530 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#start h1{font-size:30px}
#start p{color:#c8d6ff;margin:8px 0 28px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:420px;max-height:45vh;overflow-y:auto}
.plist button{padding:18px 8px;border-radius:16px;border:2px solid #ffffff33;background:#ffffff14;color:#fff;font-size:19px;font-weight:800;cursor:pointer}
.plist button.last{border-color:#fff}
.plist button:active{background:var(--rouge)}
.auth{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.auth input{background:#ffffff14;border:1px solid #ffffff44;color:#fff;border-radius:12px;padding:13px;font-size:16px}
.auth input::placeholder{color:#c8d6ff}
.auth .big{margin-top:0}
.amsg{min-height:18px;font-size:13.5px;color:#ffd0a0}
.pcreate{display:flex;gap:8px;width:100%;max-width:420px;margin-top:16px}
.pcreate input{flex:1;min-width:0;background:#ffffff14;border:1px solid #ffffff44;color:#fff;border-radius:12px;padding:12px;font-size:16px}
.pcreate input::placeholder{color:#c8d6ff}
.tabs{overflow-x:auto}
.tab{flex:1 0 auto;min-width:130px}
.oppbar{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.oppbar span{font-size:13px;color:var(--mute)}
.oppbar select{flex:1}
.pick{display:flex;gap:16px;width:100%;max-width:420px}
.pick button{flex:1;padding:28px 10px;border-radius:18px;border:2px solid #ffffff33;background:#ffffff14;color:#fff;font-size:24px;font-weight:800;cursor:pointer}
.pick button span{display:block;font-size:13px;font-weight:400;color:#c8d6ff;margin-top:6px}
.pick button:active{background:var(--rouge)}

    if(dTaken(d)[pid]) throw new Error("Trop tard, déjà pris !");
    const tm=d.teams[me];
    if(kind==="xi"){ if(tm.slots[i]) throw new Error("Case déjà remplie"); tm.slots[i]=pid; }
    else if(kind==="bench"){ if(tm.bench[i]) throw new Error("Case déjà remplie"); tm.bench[i]=pid; }
    else { if(tm.coach) throw new Error("Tu as déjà un entraîneur"); tm.coach=pid; }
    d.picks.push({by:me,pid,kind,i,at:Date.now()});

    if(dCount(d.teams[o])<n) d.turn=o; else if(dCount(tm)<n) d.turn=me; else { d.status="done"; d.turn=null; }

  const T=$("#tradeUI"); const d=tdraft; const pg=ptsOf(d.give), pw=ptsOf(d.want); const eq=pg>0&&pg===pw; const can=pg>0&&pw>0;
  const side=(w,m,key)=>{ const L=dupesOf(w); if(!L.length) return `<div class="mute" style="font-size:13px;padding:8px">Aucun doublon.</div>`;
    return L.map(x=>{ const p=BY_ID[x.id], t=cardTier(p), n=m[x.id]||0; return `<div class="tline${n?" on":""}"><span class="tmini">${cardHTML(x.id,{w:34,mini:true})}</span><span class="tname">${esc(p.name)}<small><span class="rar r-${t}">${TIER_NAME[t]}</span> ${TPTS[t]} pt${TPTS[t]>1?"s":""} · ${x.n} dispo</small></span><span class="step"><button data-k="${key}" data-id="${x.id}" data-d="-1">−</button><b>${n}</b><button data-k="${key}" data-id="${x.id}" data-d="1"${n>=x.n?" disabled":""}>+</button></span></div>`; }).join(""); };
  T.innerHTML=`<div class="tui-box">
    <div class="tui-head"><b>Nouvel échange</b><button class="btn sm ghost" id="tClose">Fermer</button></div>
    <div class="field"><span>Avec</span><select id="tTo">${others().map(x=>`<option value="${esc(x)}" ${x===d.to?"selected":""}>${esc(NAMES[x])}</option>`).join("")}</select></div>
    <div class="tbal ${eq?"ok":""}"><div>Tu donnes<b>${pg}</b>pts</div><div class="tsym">${eq?"=":pg>pw?">":"<"}</div><div>Tu reçois<b>${pw}</b>pts</div></div>
    <div class="tmsg">${!can?"Choisis au moins une carte de chaque côté":eq?"✅ Échange équilibré":pg>pw?`⚠️ Tu donnes ${pg-pw} pt${pg-pw>1?"s":""} de plus : c'est ton choix, ${esc(NAMES[d.to])} sera gagnant`:`⚠️ Tu demandes ${pw-pg} pt${pw-pg>1?"s":""} de plus : ${esc(NAMES[d.to])} devra accepter de donner plus`}</div>
    <h4>Tu donnes (tes doublons)</h4><div class="tlist">${side(me,d.give,"give")}</div>
    <h4>Tu reçois (doublons de ${esc(NAMES[d.to])})</h4><div class="tlist">${side(d.to,d.want,"want")}</div>
    <button class="btn big" id="tSend" ${can?"":"disabled"}>Envoyer la proposition</button></div>`;
  $("#tClose").onclick=()=>T.classList.remove("open");
  $("#tTo").onchange=e=>{ d.to=e.target.value; d.want={}; renderTradeUI(); };
  T.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{ const m=d[b.dataset.k]; const v=(m[b.dataset.id]||0)+(+b.dataset.d); if(v<=0) delete m[b.dataset.id]; else m[b.dataset.id]=v; const sc=T.querySelector(".tui-box").scrollTop; renderTradeUI(); T.querySelector(".tui-box").scrollTop=sc; });
  $("#tSend").onclick=sendTrade;
}
async function sendTrade(){
  const d=tdraft; const c=W();
  if(!ptsOf(d.give)||!ptsOf(d.want)) return;
  for(const [pid,n] of Object.entries(d.give)) if((c.coll[pid]||0)<n+1){ toast("Tu n'as plus ces doublons",true); return; }
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{ await db.collection("onzeol_trades").doc(id).set({from:me,to:d.to,give:d.give,want:d.want,status:"pending",at:Date.now(),settledFrom:false}); }
  catch(e){ toast("Impossible d'envoyer (règles Firebase à jour ?)",true); return; }
  { const c=W(); for(const [pid,n] of Object.entries(d.give)) c.coll[pid]-=n; } // mises de côté
  save(); $("#tradeUI").classList.remove("open"); toast(`Proposition envoyée à ${NAMES[d.to]} ✓`); renderCollec();
}
// ---------- Marché de doublons entre joueurs ----------
const TAX=.05, PMAX=20;
let market={}, mkFilter="all", mkSeen=null;
function onMarket(all){
  market=all; const c=W(); let changed=false;
  for(const [id,l] of Object.entries(market)){
    if(l.seller!==me||l.settled) continue;
    if(l.status==="sold"){ const gain=Math.round(l.price*(1-TAX)); c.coins=(c.coins||0)+gain; changed=true; toast(`🏪 ${NAMES[l.buyer]||"?"} a acheté ${BY_ID[l.pid]?.name} : +${gain} 🪙`); }
    else if(l.status==="cancelled"){ c.coll[l.pid]=(c.coll[l.pid]||0)+1; changed=true; }
    else continue;
    db.collection("onzeol_market").doc(id).update({settled:true}).catch(()=>{});
  }
  if(changed){ save(); renderCoins(); }
  if(mode==="collec"&&!$("#packfx").classList.contains("open")) renderMarket();
}
function renderMarket(){
  const el=$("#cMarket"); if(!el||!me) return; const c=W();
  const rk={bronze:0,silver:1,gold:2,icon:3,myth:4};
  const open=Object.entries(market).filter(([i,l])=>l.status==="open"&&BY_ID[l.pid]);
  const others_=open.filter(([i,l])=>l.seller!==me&&(mkFilter==="all"||(mkFilter==="new"?!c.coll[l.pid]:cardTier(BY_ID[l.pid])===mkFilter))).sort((a,b)=>rk[cardTier(BY_ID[b[1].pid])]-rk[cardTier(BY_ID[a[1].pid])]||a[1].price-b[1].price);
  const mine=open.filter(([i,l])=>l.seller===me);
  const sold=Object.entries(market).filter(([i,l])=>l.status==="sold"&&(l.seller===me||l.buyer===me)).sort((a,b)=>(b[1].soldAt||0)-(a[1].soldAt||0)).slice(0,5);
  const card=(l,btn)=>{ const p=BY_ID[l.pid], t=cardTier(p); return `<div class="mk"><span class="tmini">${cardHTML(l.pid,{w:40,mini:true})}</span><span class="tname">${esc(p.name)}<small><span class="rar r-${t}">${TIER_NAME[t]}</span> ${l.seller===me?"":"par "+esc(NAMES[l.seller]||"?")}${!c.coll[l.pid]&&l.seller!==me?' · <b style="color:#7ee2a0">manque à ton album</b>':""}</small></span><span class="mkp">🪙 ${l.price}</span>${btn}</div>`; };
  const F=[["all","Tout"],["new","Manquantes"],["myth","Myth."],["icon","Légend."],["gold","Épiques"],["silver","Rares"],["bronze","Communes"]];
  el.innerHTML=`<h3>🏪 Marché <small>doublons entre joueurs</small></h3>
    <button class="btn big" id="mkSell" style="margin-top:0">Mettre un doublon en vente</button>
    <div class="rules" style="font-size:12px">Un prix est conseillé pour chaque joueur (rareté, note, palmarès et ventes récentes) : tu peux le modifier, même une fois en vente. Le marché prend ${TAX*100} % de taxe sur chaque vente.</div>
    <div class="chips" style="margin:8px 0">${F.map(([k,l])=>`<button class="chip${mkFilter===k?" on":""}" data-mf="${k}">${l}</button>`).join("")}</div>
    ${others_.length?others_.map(([id,l])=>card(l,`<button class="btn sm" data-buy="${id}" ${(c.coins||0)<l.price?"disabled":""}>Acheter</button>`)).join(""):`<div class="mute" style="font-size:13px">Aucune carte en vente${mkFilter!=="all"?" dans ce filtre":""}.</div>`}
    ${mine.length?`<h4>Mes ventes en cours</h4>`+mine.map(([id,l])=>card(l,`<span class="tbtns" style="flex-direction:column;gap:4px"><button class="btn sm ghost" data-edit="${id}">Prix</button><button class="btn sm ghost" data-unl="${id}">Retirer</button></span>`)).join(""):""}
    ${sold.length?`<h4>Dernières transactions</h4>`+sold.map(([id,l])=>`<div class="mute" style="font-size:12px;padding:3px 0">${l.seller===me?`💰 Vendu ${esc(BY_ID[l.pid].name)} à ${esc(NAMES[l.buyer]||"?")} : +${Math.round(l.price*(1-TAX))} 🪙`:`🛒 Acheté ${esc(BY_ID[l.pid].name)} à ${esc(NAMES[l.seller]||"?")} : −${l.price} 🪙`}</div>`).join(""):""}`;
  $("#mkSell").onclick=openSellUI;
  el.querySelectorAll("[data-mf]").forEach(b=>b.onclick=()=>{mkFilter=b.dataset.mf;renderMarket();});
  el.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{ const l=market[b.dataset.buy]; openModal(`Acheter ${BY_ID[l.pid].name} pour ${l.price} 🪙 ?`,null,[["Acheter",()=>buyListing(b.dataset.buy)],["Annuler",null,true]]); });
  el.querySelectorAll("[data-unl]").forEach(b=>b.onclick=()=>unlist(b.dataset.unl));
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const id=b.dataset.edit, l=market[id]; priceModal(l.pid,l.price,async pr=>{ const ref=db.collection("onzeol_market").doc(id);
    try{ await firebase.firestore().runTransaction(async tx=>{ const s=await tx.get(ref); const x=s.data(); if(!x||x.status!=="open") throw new Error("Déjà vendue !"); tx.update(ref,{price:pr}); }); toast(`Nouveau prix : ${pr} 🪙`); }catch(e){ toast(e.message||"Raté",true); } }); });
}
function suggestPrice(pid){
  const p=BY_ID[pid], t=cardTier(p); const min=SELL[t], max=SELL[t]*PMAX;
  // base : rareté × note × palmarès
  let v=SELL[t]*3*(1+(p.ovr-70)/40)*(1+Math.min(palmScore(p),60)/80);
  // ajusté par les ventes récentes de ce joueur
  const past=Object.values(market).filter(l=>l.pid===pid&&l.status==="sold").map(l=>l.price);
  if(past.length) v=(v+past.reduce((a,b)=>a+b,0)/past.length)/2;
  return Math.max(min,Math.min(max,Math.round(v/5)*5||min));
}
function priceModal(pid,cur,onOk){
  const t=cardTier(BY_ID[pid]); const min=SELL[t], max=SELL[t]*PMAX, sug=suggestPrice(pid);
  openModal(`${BY_ID[pid].name} · prix conseillé ${sug} 🪙 (de ${min} à ${max})`,String(cur||sug),[[cur?"Modifier le prix":"Mettre en vente",v=>{ const pr=Math.round(+v); if(!(pr>=min&&pr<=max)){ toast(`Prix entre ${min} et ${max} 🪙`,true); return false; } onOk(pr); }],["Annuler",null,true]]);
  $("#mInput").type="number"; $("#mInput").inputMode="numeric";
}
function openSellUI(){
  const L=dupesOf(me); if(!L.length){ toast("Tu n'as aucun doublon à vendre",true); return; }
  const T=$("#tradeUI"); T.classList.add("open");
  T.innerHTML=`<div class="tui-box"><div class="tui-head"><b>Mettre en vente</b><button class="btn sm ghost" id="tClose">Fermer</button></div>
    <div class="tlist">${L.map(x=>{ const p=BY_ID[x.id], t=cardTier(p); return `<div class="tline" data-pick="${x.id}"><span class="tmini">${cardHTML(x.id,{w:34,mini:true})}</span><span class="tname">${esc(p.name)}<small><span class="rar r-${t}">${TIER_NAME[t]}</span> ${x.n} dispo · conseillé ${suggestPrice(x.id)} 🪙</small></span><button class="btn sm">Vendre</button></div>`; }).join("")}</div></div>`;
  $("#tClose").onclick=()=>T.classList.remove("open");
  T.querySelectorAll("[data-pick]").forEach(r=>r.onclick=()=>{ const id=r.dataset.pick; T.classList.remove("open"); priceModal(id,null,pr=>listCard(id,pr)); });
}
async function listCard(pid,price){
  const c=W(); if((c.coll[pid]||0)<2){ toast("Plus de doublon de cette carte",true); return; }
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{ await db.collection("onzeol_market").doc(id).set({seller:me,pid,price,status:"open",at:Date.now(),settled:false}); }
  catch(e){ toast("Impossible de mettre en vente (règles Firebase à jour ?)",true); return; }
  W().coll[pid]--; save(); toast(`${BY_ID[pid].name} mis en vente à ${price} 🪙`); renderCollec();
}
async function unlist(id){
  const ref=db.collection("onzeol_market").doc(id);
  try{ await firebase.firestore().runTransaction(async tx=>{ const s=await tx.get(ref); const l=s.data(); if(!l||l.status!=="open") throw new Error("Déjà vendue !"); tx.update(ref,{status:"cancelled"}); }); toast("Carte retirée du marché"); }
  catch(e){ toast(e.message||"Raté",true); }
}
async function buyListing(id){
  const c=W(); const l=market[id]; if(!l) return;
  if((c.coins||0)<l.price){ toast("Pas assez de pièces",true); return; }
  const ref=db.collection("onzeol_market").doc(id);
  try{ await firebase.firestore().runTransaction(async tx=>{ const s=await tx.get(ref); const x=s.data(); if(!x||x.status!=="open") throw new Error("Trop tard, déjà vendue !"); tx.update(ref,{status:"sold",buyer:me,soldAt:Date.now()}); }); }
  catch(e){ toast(e.message||"Raté, réessaie",true); return; }
  { const c=W(); c.coins-=l.price; c.coll[l.pid]=(c.coll[l.pid]||0)+1; } save(); renderCoins();
  toast(`${BY_ID[l.pid].name} ajouté à ta collection ✓`); renderCollec();
}
// ---------- Synchro Firebase (comptes) ----------
let db=null, saveT=null, dirty=false, unsubs=[];
function setSync(t,cls){ const s=$("#sync"); s.textContent=t; s.className="sync "+(cls||""); }
function cache(){ try{localStorage.setItem("onze-ol-cache2",JSON.stringify(compos));}catch(e){} }
function save(){ cache(); dirty=true; clearTimeout(saveT); saveT=setTimeout(push,400); }
async function push(){
  if(!db||!me){ return false; }
  const data={...C(me), name:NAMES[me]||"?", updated:Date.now()};
  try{ await db.collection("onzeol_users").doc(me).set(data); }
  catch(e){ setSync("⚠️ Enregistrement impossible, réessaie","err"); return false; }
  dirty=false; setSync("✓ Synchronisé","ok"); return true;
}
async function importLegacy(name){
  // Récupère les compos de l'ancienne version (Thib / Val) une seule fois
  const key=slug(name); if(key!=="thib"&&key!=="val") return;
  try{
    const lref=db.collection("families").doc(ROOM); const ls=await lref.get(); const L=ls.exists?ls.data():{};
    if(!L[key]||(L.claimed||{})[key]) return;
    const c=norm(L[key]); if(!Object.keys(c.slots).length&&!c.library.length) return;
    compos[me]=Object.assign(c,{coins:compos[me].coins||300}); await push(); await lref.set({claimed:{[key]:me}},{merge:true});
    toast("Tes compos de l'ancienne version ont été récupérées ✓"); render();
  }catch(e){}
}
function startListeners(){
  unsubs.forEach(u=>u()); unsubs=[];
  unsubs.push(db.collection("onzeol_users").onSnapshot(qs=>{
    const seen={};
    qs.forEach(doc=>{ const d=doc.data()||{}; seen[doc.id]=1; NAMES[doc.id]=d.name||"?"; if(doc.id===me&&dirty) return; compos[doc.id]=norm(d); });
    for(const id of Object.keys(NAMES)) if(!seen[id]&&id!==me) delete NAMES[id];
    try{ localStorage.setItem("onze-ol-names2",JSON.stringify(NAMES)); }catch(e){}
    cache(); setSync("✓ Synchronisé","ok"); render(); renderCoins(); if(mode==="match") renderMatch(); if(mode==="draft") renderDraft(); if(mode==="collec"&&!$("#packfx").classList.contains("open")) renderCollec();
    if(dirty) push();
  },()=>setSync("⚠️ Synchro coupée — recharge la page","err")));
  unsubs.push(db.collection("onzeol_drafts").onSnapshot(qs=>{ const all={}; qs.forEach(doc=>all[doc.id]=doc.data()); onDraftData(all); },()=>{}));
  unsubs.push(db.collection("onzeol_trades").onSnapshot(qs=>{ const all={}; qs.forEach(doc=>{ const t=doc.data(); if(t&&(t.from===me||t.to===me)) all[doc.id]=t; }); onTrades(all); },()=>{}));
  unsubs.push(db.collection("onzeol_market").onSnapshot(qs=>{ const all={}; qs.forEach(doc=>{ const l=doc.data(); if(l&&(l.status==="open"||l.seller===me||l.buyer===me)) all[doc.id]=l; }); onMarket(all); },()=>{}));
  unsubs.push(db.collection("onzeol_meta").doc("main").onSnapshot(snap=>{ const d=snap.exists?snap.data():{}; onMatchData(d.match,d.matches); },()=>{}));
}
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user||user.isAnonymous){
      unsubs.forEach(u=>u()); unsubs=[]; me=null;
      $("#start").style.display="flex"; setSync("Non connecté",""); return;
    }
    me=user.uid; C(me);
    setSync("Connexion…","");
    const uref=db.collection("onzeol_users").doc(me);
    try{
      const s=await uref.get();
      if(s.exists){ const d=s.data(); NAMES[me]=d.name||"?"; compos[me]=norm(d); }
      else { NAMES[me]=pendingName||($("#aName").value.trim())||user.email.split("@")[0]; compos[me]=blank(); compos[me].coins=300; await push(); await importLegacy(NAMES[me]); setTimeout(()=>toast("Bienvenue ! 300 🪙 offertes pour ton premier pack"),800); }
    }catch(e){ setSync("⚠️ Accès refusé : règles Firebase à mettre à jour","err"); }
    pendingName=null; $("#aPass").value="";
    choose(me); startListeners(); setTimeout(()=>{ if(me){ dailyBonus(); claimRewards(); renderCoins(); } },1500);
  });
}catch(e){ setSync("⚠️ Synchro indisponible","err"); }
</script>
