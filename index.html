<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="11 type OL">
<title>Notre 11 type OL</title>
<style>
:root{--bleu:#13306b;--bleu2:#1d4aa0;--rouge:#d3122d;--fond:#0b1530;--carte:#16244a;--txt:#eef2ff;--mute:#9fb0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fond);color:var(--txt);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:38px 16px 6px;text-align:center;position:relative}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 span{color:var(--rouge)}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.who{position:absolute;right:12px;top:8px;font-size:12px;color:var(--mute);background:var(--carte);border:1px solid #2b3c6e;border-radius:999px;padding:5px 10px;cursor:pointer}
.sync{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
.sync.ok{color:#7ee2a0}.sync.err{color:#ffb38a}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid #2b3c6e;background:var(--carte);color:var(--txt);font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--bleu2);border-color:#5d86e0}
.tab small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tab.on small{color:#d6e2ff}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
.bar{display:flex;gap:8px;align-items:center;margin:8px 4px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--mute)}
select,input[type=search]{background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:9px 10px;font-size:16px}
.btn{background:var(--rouge);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #2b3c6e;color:var(--mute)}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:14px;overflow:hidden;margin-top:6px;
 background:repeating-linear-gradient(180deg,#1f7a3a 0 10%,#1b6e34 10% 20%);box-shadow:0 6px 24px #0008}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;border:0;background:none;padding:0;color:#fff;font:inherit}
.shirt{width:44px;height:44px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--bleu2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--bleu);box-shadow:0 2px 6px #0007;position:relative;overflow:hidden}
.shirt::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--rouge) 40% 50%,var(--bleu2) 50% 60%,transparent 60%);opacity:.9}
.shirt b{position:relative;background:#fff;border-radius:6px;padding:0 3px}
.empty .shirt{background:#ffffff22;border:2px dashed #ffffffaa;color:#fff}
.empty .shirt::before{display:none}
.empty .shirt b{background:none;color:#fff}
.nm{margin-top:3px;font-size:11.5px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px #000;background:#0009;border-radius:6px;padding:2px 4px;display:inline-block;max-width:84px}
.ro{cursor:default}
.save{display:block;width:100%;padding:14px;font-size:16px;margin:4px 0 2px;border-radius:12px}
.save.done{background:#1f8a4c}
.saved{text-align:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.lib .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #24345f}
.lib .it:first-child{border-top:0}
.lib .it .info{flex:1;min-width:0}
.lib .it .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .it .info small{color:var(--mute);font-size:12px}
.lib .it.cur .info b{color:#7ee2a0}
.sm{font-size:12.5px;padding:7px 9px;border-radius:9px}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:#101c3d;border:1px solid #2b3c6e;border-radius:16px;padding:16px;width:100%;max-width:380px}
.mbox h3{margin:0 0 12px;font-size:17px}
.mbox input{width:100%;background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:11px;font-size:16px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mbtns .btn{padding:12px;font-size:15px}
.sbar{display:flex;align-items:center;gap:8px;margin:7px 0}
.sbar .sv{width:30px;text-align:center;font-weight:800;font-size:14px}
.sbar .sl{flex:1}
.sbar .sl span{display:block;text-align:center;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.track{height:8px;border-radius:6px;background:var(--bleu2);overflow:hidden}
.track i{display:block;height:100%;background:var(--rouge)}
.vs{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:12px 4px 2px}
.vs b{color:var(--txt)}
.score{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:center}
.score .tm{flex:1;font-weight:800;font-size:17px}
.score .tm small,.score .sc small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
.score .sc{font-size:38px;font-weight:900;min-width:120px;letter-spacing:2px}
.feed{max-height:260px;overflow-y:auto;margin-top:10px;border-top:1px solid #24345f}
.ev{display:flex;gap:8px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid #1d2b55}
.ev b{min-width:30px;color:var(--mute)}
.ev.goal{background:#1f8a4c33;border-radius:8px}
.ev.red{background:#b4432b33;border-radius:8px}
.mute{color:var(--mute)}
.motm{margin:12px 0 6px;padding:10px;border-radius:10px;background:#c9a22722;color:#ffd970;font-size:14px;text-align:center}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes h4{margin:8px 0 4px;font-size:13px;color:var(--mute)}
.nr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #1d2b55}
.nr .hi{color:#7ee2a0}.nr .lo{color:#ff9aa8}
.tally{display:flex;gap:8px;margin-bottom:8px}
.tally div{flex:1;text-align:center;background:#0f1d40;border-radius:10px;padding:8px;font-size:12px;color:var(--mute)}
.tally b{display:block;font-size:24px;color:var(--txt)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f8a4c;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 6px 20px #0008;display:none}
.count{font-size:13px;color:var(--mute);margin:8px 4px}
.section{margin-top:14px;background:var(--carte);border-radius:14px;padding:12px}
.section h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between}
.section h3 small{color:var(--mute);font-weight:400}
.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
.bench .slot,.coach .slot{position:static;transform:none;width:auto}
.bench .nm,.coach .nm{background:#0006}
.coach{display:flex;justify-content:center}
.coach .shirt{background:#1b2a55;border-color:#c9a227;color:#ffd970}
.coach .shirt::before{display:none}
.coach .shirt b{background:none;color:#ffd970}
.coach .nm{max-width:160px;font-size:13px}
.crow{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;font-size:13px;padding:6px 0;border-top:1px solid #24345f}
.crow.head{font-weight:700;border-top:0;color:var(--mute)}
.crow .p{color:var(--mute);font-weight:700}
.same{color:#7ee2a0;font-weight:700}
/* sheet */
.veil{position:fixed;inset:0;background:#000a;display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:#101c3d;border-radius:18px 18px 0 0;z-index:11;display:none;flex-direction:column;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open,.veil.open{display:flex}
.sh-head{padding:14px 16px 8px;border-bottom:1px solid #24345f}
.sh-head h2{margin:0 0 8px;font-size:17px}
.sh-head .row{display:flex;gap:8px;align-items:center}
.sh-head input{flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid #2b3c6e;background:transparent;color:var(--mute);cursor:pointer}
.chip.on{background:var(--bleu2);color:#fff;border-color:#5d86e0}
.list{overflow-y:auto;padding:6px 8px 20px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;border-radius:10px;cursor:pointer;gap:8px}
.pl:active{background:#1c2c5c}
.pl .n{font-weight:600;font-size:15px}
.yr{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:1px}
.pl .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:10.5px;padding:2px 6px;border-radius:6px;background:#24345f;color:#c8d6ff;font-weight:700}
.tag.cur{background:var(--rouge);color:#fff}
.pl.used{opacity:.4}
.tk{display:block;font-weight:600;font-size:11.5px;color:#ff9aa8;margin-top:1px}
.modes{display:flex;gap:6px;margin:6px 16px 0;background:#0f1d40;border-radius:12px;padding:4px}
.modes button{flex:1;border:0;background:none;color:var(--mute);font-weight:700;font-size:14px;padding:9px;border-radius:9px;cursor:pointer}
.modes button.on{background:var(--rouge);color:#fff}
.dbanner{margin:10px 0 4px;padding:14px;border-radius:14px;text-align:center;font-weight:800;font-size:18px;background:var(--carte)}
.dbanner.me{background:linear-gradient(90deg,#d3122d,#1d4aa0);animation:pulse 1.4s ease-in-out infinite}
.dbanner small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:3px}
@keyframes pulse{50%{filter:brightness(1.25)}}
.field{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.field span{font-size:14px;color:var(--mute)}
.rules{font-size:13px;color:#c8d6ff;line-height:1.5;margin:10px 0}
.logrow{font-size:13px;padding:6px 0;border-top:1px solid #24345f;display:flex;gap:8px}
.logrow b{color:var(--mute);min-width:26px}
.big{display:block;width:100%;padding:15px;font-size:16px;border-radius:12px;margin-top:10px}
/* accueil */
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 20%,#1d4aa0 0,#0b1530 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#start h1{font-size:30px}
#start p{color:#c8d6ff;margin:8px 0 28px}
.pick{display:flex;gap:16px;width:100%;max-width:420px}
.pick button{flex:1;padding:28px 10px;border-radius:18px;border:2px solid #ffffff33;background:#ffffff14;color:#fff;font-size:24px;font-weight:800;cursor:pointer}
.pick button span{display:block;font-size:13px;font-weight:400;color:#c8d6ff;margin-top:6px}
.pick button:active{background:var(--rouge)}
</style>
</head>
<body>
<div id="start">
  <h1>Notre 11 type <span style="color:var(--rouge)">OL</span></h1>
  <p>Qui joue ?</p>
  <div class="pick">
    <button data-me="thib">Thib<span>2e de la fratrie</span></button>
    <button data-me="val">Val<span>le grand frère</span></button>
  </div>
</div>

<header>
  <button class="who" id="who">Changer</button>
  <h1>Notre 11 type <span>OL</span></h1>
  <div class="sub">Tous les joueurs passés par Lyon depuis 2000</div>
  <div class="sync" id="sync">Connexion…</div>
</header>
<div class="modes"><button id="mCompo" class="on">11 type</button><button id="mDraft">⚡ Draft</button><button id="mMatch">🏟️ Match</button></div>
<div id="viewCompo">
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="bar" id="bar">
    <label for="formation">Système</label>
    <select id="formation"></select>
    <button class="btn ghost" id="reset">Tout effacer</button>
  </div>
  <div class="pitch" id="pitch">
    <svg class="lines" viewBox="0 0 68 100" preserveAspectRatio="none">
      <g fill="none" stroke="#ffffff66" stroke-width=".35">
        <rect x="2" y="2" width="64" height="96"/>
        <line x1="2" y1="50" x2="66" y2="50"/>
        <circle cx="34" cy="50" r="8"/>
        <rect x="16" y="2" width="36" height="15"/><rect x="25" y="2" width="18" height="5.5"/>
        <rect x="16" y="83" width="36" height="15"/><rect x="25" y="92.5" width="18" height="5.5"/>
      </g>
    </svg>
  </div>
  <div class="count" id="count"></div>
  <button class="btn save" id="saveBtn">💾 Sauvegarder la compo</button>
  <div class="saved" id="savedInfo"></div>
  <div class="section" id="libSec"><h3>Mes compos enregistrées <small id="libCount"></small></h3><div class="lib" id="lib"></div></div>
  <div class="section"><h3>Remplaçants <small id="benchCount"></small></h3><div class="bench" id="bench"></div></div>
  <div class="section"><h3>Entraîneur</h3><div class="coach" id="coach"></div></div>
  <div class="section" id="compare"></div>
</div>

</div>
<div id="viewDraft" class="wrap" style="display:none">
  <div class="dbanner" id="dBanner"></div>
  <div class="section" id="dLobby"></div>
  <div id="dGame">
    <div class="tabs" id="dTabs" style="padding:8px 0"></div>
    <div class="pitch" id="dPitch"><svg class="lines" viewBox="0 0 68 100" preserveAspectRatio="none">
      <g fill="none" stroke="#ffffff66" stroke-width=".35">
        <rect x="2" y="2" width="64" height="96"/>
        <line x1="2" y1="50" x2="66" y2="50"/>
        <circle cx="34" cy="50" r="8"/>
        <rect x="16" y="2" width="36" height="15"/><rect x="25" y="2" width="18" height="5.5"/>
        <rect x="16" y="83" width="36" height="15"/><rect x="25" y="92.5" width="18" height="5.5"/>
      </g>
    </svg></div>
    <div class="section" id="dBenchSec"><h3>Remplaçants</h3><div class="bench" id="dBench"></div></div>
    <div class="section" id="dCoachSec"><h3>Entraîneur</h3><div class="coach" id="dCoach"></div></div>
    <div class="section"><h3>Derniers choix</h3><div id="dLog"></div></div>
    <button class="btn big" id="dNew" style="display:none">🔁 Nouveau draft</button>
    <button class="btn ghost big" id="dReset">Recommencer le draft</button>
  </div>
</div>
<div id="viewMatch" class="wrap" style="display:none">
  <div class="section" id="mBoard" style="display:none"></div>
  <div class="section" id="mSetup"></div>
  <div class="section" id="mHist"></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbox"><h3 id="mTitle"></h3><input id="mInput" maxlength="40" autocomplete="off"><div class="mbtns" id="mBtns"></div></div></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet">
  <div class="sh-head">
    <h2 id="shTitle">Choisir</h2>
    <div class="row">
      <input type="search" id="q" placeholder="Rechercher…" autocomplete="off">
      <button class="btn ghost" id="clearSlot">Vider</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
</div>

  $("#mSetup").innerHTML=`<h3>🏟️ Simulation de match</h3>
   <div class="field"><span>Équipe de Thib</span><select id="selA">${oa.map(o=>`<option value="${esc(o.key)}" ${o.key===selA?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>
   <div class="field"><span>Équipe de Val</span><select id="selB">${ob.map(o=>`<option value="${esc(o.key)}" ${o.key===selB?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>
   <div class="vs"><b>Thib</b><span>Force</span><b>Val</b></div>
   ${bar("Global",A.global,B.global)}${bar("Attaque",A.att,B.att)}${bar("Milieu",A.mid,B.mid)}${bar("Défense",A.def,B.def)}${bar("Gardien",A.gk,B.gk)}${bar("Coach",A.coach,B.coach)}
   <button class="btn big" id="mGo" ${live?"disabled":""}>${live?"Match en cours…":"▶️ Lancer le match"}</button>
   <div class="rules" style="font-size:12px;margin-bottom:0">Le résultat dépend des notes des joueurs, de leurs vraies stats à l'OL (matchs joués = expérience, ratio buts/match = efficacité devant le but), de leur placement (un joueur hors de son poste perd du niveau) et de l'entraîneur… avec une part de hasard, comme au vrai foot.</div>`;
  $("#selA").onchange=e=>{selA=e.target.value;renderMatch();};
  $("#selB").onchange=e=>{selB=e.target.value;renderMatch();};
  $("#mGo").onclick=launchMatch;
  renderBoard();
  // historique
  const w={thib:0,val:0,n:0}; for(const h of matches){ const [a,b]=h.score; if(a>b)w.thib++; else if(b>a)w.val++; else w.n++; }
  $("#mHist").innerHTML=`<h3>Bilan <small>${matches.length} match${matches.length>1?"s":""}</small></h3>
    <div class="tally"><div><b>${w.thib}</b>Thib</div><div><b>${w.n}</b>Nuls</div><div><b>${w.val}</b>Val</div></div>
    ${matches.slice(0,10).map(h=>`<div class="logrow"><span style="flex:1">${esc(h.labels[0])}</span><b style="min-width:auto">${h.score[0]} - ${h.score[1]}</b><span style="flex:1;text-align:right">${esc(h.labels[1])}</span></div>`).join("")}`;
}
function renderBoard(){
  const el=$("#mBoard");
  if(!match){ el.style.display="none"; clearInterval(mTimer); mTimer=null; return; }
  el.style.display="";
  const cur=matchMinute(); const done=cur>=match.len+.5;
  const shown=match.ev.filter(e=>e.m<=cur);
  const sc=[0,0]; shown.forEach(e=>{if(e.k==="goal")sc[e.t]++;});
  const clock= cur<0?"Coup d'envoi…": done?"Terminé": cur>=45&&cur<45.5?"45'":`${Math.min(Math.floor(cur)||1,match.len)}'`;
  let h=`<div class="score"><div class="tm">Thib<small>${esc(match.teams[0].label)}</small></div><div class="sc">${sc[0]} - ${sc[1]}<small>${clock}</small></div><div class="tm">Val<small>${esc(match.teams[1].label)}</small></div></div>`;
  h+=`<div class="feed">${shown.slice().reverse().map(e=>`<div class="ev ${e.k}"><b>${e.k==="ht"||e.k==="ft"?"":Math.floor(e.m)+"'"}</b><span>${evText(e)}</span></div>`).join("")||`<div class="ev"><span class="mute">Les joueurs entrent sur la pelouse…</span></div>`}</div>`;
  if(!done) h+=`<button class="btn ghost big" id="mSkipBtn">⏩ Voir le résultat</button>`;
  else{
    const M=match;
    h+=`<div class="vs" style="margin-top:12px"><b>Thib</b><span>Stats</span><b>Val</b></div>`+bar("Possession %",M.poss,100-M.poss,1)+bar("Tirs",M.shots[0],M.shots[1],1)+bar("Tirs cadrés",M.onT[0],M.onT[1],1);
    const mo=M.motm; if(mo) h+=`<div class="motm">⭐ Homme du match : <b>${esc(BY_ID[mo.pid]?.name||"?")}</b> (${TEAMN[mo.t]}) · ${M.notes[mo.t][mo.pid]}/10</div>`;
    h+=`<div class="notes">${[0,1].map(t=>`<div><h4>Notes ${TEAMN[t]}</h4>${M.teams[t].lineup.filter(l=>l.pid).map(l=>`<div class="nr"><span>${l.role} ${esc(pn(l.pid))}</span><b class="${M.notes[t][l.pid]>=7.5?"hi":M.notes[t][l.pid]<5.5?"lo":""}">${M.notes[t][l.pid]}</b></div>`).join("")}</div>`).join("")}</div>`;
  }
  el.innerHTML=h;
  const sk=$("#mSkipBtn"); if(sk) sk.onclick=()=>{mSkip=match.id;renderMatch();};
  if(!done&&!mTimer) mTimer=setInterval(()=>{ if(mode!=="match") return; const d=matchMinute()>=match.len+.5; renderBoard(); if(d){clearInterval(mTimer);mTimer=null;renderMatch();} },MSPEED);
  if(done&&mTimer){clearInterval(mTimer);mTimer=null;}
}

// ---------- Synchro Firebase ----------
let ref=null, saveT=null, dirty=false;
function setSync(t,cls){ const s=$("#sync"); s.textContent=t; s.className="sync "+(cls||""); }
function cache(){ try{localStorage.setItem("onze-ol-cache",JSON.stringify(compos));}catch(e){} }
function save(){ cache(); dirty=true; clearTimeout(saveT); saveT=setTimeout(push,400); }
async function push(){
  if(!ref||!me){ return false; }
  const data={...compos[me], updated:Date.now()};
  try{ await ref.update({[me]:data}); }
  catch(e){ try{ await ref.set({[me]:data},{merge:true}); }catch(e2){ setSync("⚠️ Enregistrement impossible, réessaie","err"); return false; } }
  dirty=false; setSync("✓ Synchronisé","ok"); return true;
}
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().signInAnonymously().then(()=>{
    ref=firebase.firestore().collection("families").doc(ROOM);
    ref.onSnapshot(snap=>{
      const d=snap.exists?snap.data():{};
      for(const w of ["thib","val"]){ if(w===me && dirty) continue; compos[w]=norm(d[w]); }
      cache(); setSync("✓ Synchronisé","ok"); render();
      onDraftData(d.draft);
      onMatchData(d.match,d.matches);
      if(dirty) push();
    }, ()=>setSync("⚠️ Synchro coupée — recharge la page","err"));
  }).catch(()=>setSync("⚠️ Pas de connexion — compo gardée sur ce téléphone","err"));
}catch(e){ setSync("⚠️ Synchro indisponible","err"); }
</script>
