<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gones Legends">
<title>Les Gones Legends</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bleu:#13306b;--bleu2:#1d4aa0;--rouge:#d3122d;--fond:#0b1530;--carte:#16244a;--txt:#eef2ff;--mute:#9fb0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fond);color:var(--txt);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:38px 16px 6px;text-align:center;position:relative}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 span{color:var(--rouge)}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.who{position:absolute;right:12px;top:8px;font-size:12px;color:var(--mute);background:var(--carte);border:1px solid #2b3c6e;border-radius:999px;padding:5px 10px;cursor:pointer}
.sync{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
.sync.ok{color:#7ee2a0}.sync.err{color:#ffb38a}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid #2b3c6e;background:var(--carte);color:var(--txt);font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--bleu2);border-color:#5d86e0}
.tab small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tab.on small{color:#d6e2ff}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
.bar{display:flex;gap:8px;align-items:center;margin:8px 4px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--mute)}
select,input[type=search]{background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:9px 10px;font-size:16px}
.btn{background:var(--rouge);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #2b3c6e;color:var(--mute)}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:14px;overflow:hidden;margin-top:6px;
 background:repeating-linear-gradient(180deg,#1f7a3a 0 10%,#1b6e34 10% 20%);box-shadow:0 6px 24px #0008}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;border:0;background:none;padding:0;color:#fff;font:inherit}
.shirt{width:44px;height:44px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--bleu2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--bleu);box-shadow:0 2px 6px #0007;position:relative;overflow:hidden}
.shirt::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--rouge) 40% 50%,var(--bleu2) 50% 60%,transparent 60%);opacity:.9}
.shirt b{position:relative;background:#fff;border-radius:6px;padding:0 3px}
.empty .shirt{background:#ffffff22;border:2px dashed #ffffffaa;color:#fff}
.empty .shirt::before{display:none}
.empty .shirt b{background:none;color:#fff}
.nm{margin-top:3px;font-size:11.5px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px #000;background:#0009;border-radius:6px;padding:2px 4px;display:inline-block;max-width:84px}
.ro{cursor:default}
.save{display:block;width:100%;padding:14px;font-size:16px;margin:4px 0 2px;border-radius:12px}
.save.done{background:#1f8a4c}
.saved{text-align:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.lib .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #24345f}
.lib .it:first-child{border-top:0}
.lib .it .info{flex:1;min-width:0}
.lib .it .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .it .info small{color:var(--mute);font-size:12px}
.lib .it.cur .info b{color:#7ee2a0}
.sm{font-size:12.5px;padding:7px 9px;border-radius:9px}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.invst{text-align:center;font-weight:800;font-size:15px;padding:12px;margin:10px 0 8px;border-radius:12px;background:rgba(255,255,255,.06)}.invst small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:3px}.invst.me{background:rgba(255,217,112,.12);border:1px solid rgba(255,217,112,.35)}
.peekbar{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(255,217,112,.1);border:1px solid rgba(255,217,112,.3);border-radius:12px;font-size:14px}
/* Fenêtres plus hautes que l'écran : elles défilent elles-mêmes, et la page derrière ne bouge plus */
.modal{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal>*{margin-top:auto;margin-bottom:auto;flex-shrink:0}
.cardm{background:#000e}
html:has(.modal.open),body:has(.modal.open){overflow:hidden}
.mbox{background:#101c3d;border:1px solid #2b3c6e;border-radius:16px;padding:16px;width:100%;max-width:380px}
.mbox h3{margin:0 0 12px;font-size:17px}
.mbox input{width:100%;background:var(--carte);color:var(--txt);border:1px solid #2b3c6e;border-radius:10px;padding:11px;font-size:16px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mbtns .btn{padding:12px;font-size:15px}
.sbar{display:flex;align-items:center;gap:8px;margin:7px 0}
.sbar .sv{width:30px;text-align:center;font-weight:800;font-size:14px}
.sbar .sl{flex:1}
.sbar .sl span{display:block;text-align:center;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.track{height:8px;border-radius:6px;background:var(--bleu2);overflow:hidden}
.track i{display:block;height:100%;background:var(--rouge)}
.vs{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:12px 4px 2px}
.vs b{color:var(--txt)}
.score{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:center}
.score .tm{flex:1;font-weight:800;font-size:17px}
.score .tm small,.score .sc small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
.score .sc{font-size:38px;font-weight:900;min-width:120px;letter-spacing:2px}
.feed{max-height:260px;overflow-y:auto;margin-top:10px;border-top:1px solid #24345f}
.ev{display:flex;gap:8px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid #1d2b55}
.ev b{min-width:30px;color:var(--mute)}
.ev.goal{background:#1f8a4c33;border-radius:8px}
.ev.red{background:#b4432b33;border-radius:8px}
.mute{color:var(--mute)}
.motm{margin:12px 0 6px;padding:10px;border-radius:10px;background:#c9a22722;color:#ffd970;font-size:14px;text-align:center}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes h4{margin:8px 0 4px;font-size:13px;color:var(--mute)}
.nr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #1d2b55}
.nr .hi{color:#7ee2a0}.nr .lo{color:#ff9aa8}
.psel{max-width:42%;font-weight:700}
.vsmid{text-align:center;font-weight:900;color:var(--rouge);margin:-4px 0}
.rk{display:grid;grid-template-columns:24px 1fr 30px 30px 30px 40px;gap:4px;font-size:14px;padding:7px 4px;border-top:1px solid #24345f;text-align:center}
.rk span:nth-child(2){text-align:left;font-weight:700}
.rk.head{color:var(--mute);font-size:12px;border-top:0}
.rk.me{background:#1d4aa033;border-radius:8px}
.tally{display:flex;gap:8px;margin-bottom:8px}
.tally div{flex:1;text-align:center;background:#0f1d40;border-radius:10px;padding:8px;font-size:12px;color:var(--mute)}
.tally b{display:block;font-size:24px;color:var(--txt)}
.fcard{--w:160px;width:var(--w);height:calc(var(--w)*1.42);position:relative;font-size:calc(var(--w)/10);color:#4a3606;clip-path:polygon(50% 0,100% 7%,100% 85%,50% 100%,0 85%,0 7%);background:linear-gradient(155deg,#fff6c2 0%,#ecc95f 30%,#c39531 62%,#f3d77a 100%);overflow:hidden;flex:none;font-family:system-ui,-apple-system,sans-serif;text-align:left}
.fcard.silver{background:linear-gradient(155deg,#ffffff,#d5dae1 35%,#97a1ad 70%,#e6eaef);color:#263038}
.fcard.bronze{background:linear-gradient(155deg,#f9d6b3,#cf915a 40%,#8d5627 75%,#e2a774);color:#2f1806}
.fcard.icon{background:linear-gradient(155deg,#fffdf5,#f0e5c4 35%,#cdb67c 70%,#fff4d2);color:#3d2d06}
.fcard.icon::before{content:"";position:absolute;inset:4%;clip-path:inherit;border:calc(var(--w)/70) solid #b8954166}
.fcard.myth{background:linear-gradient(155deg,#2a1240,#5b1e7a 30%,#1a0b2e 60%,#d7a8ff 100%);color:#ffe7a3}
.fcard.myth::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#ff6ad533,#6ad5ff33,#ffe76a33,#ff6ad533);mix-blend-mode:screen;animation:spin 6s linear infinite}
.fcard.myth .fc-shine{background:linear-gradient(115deg,transparent 30%,#ffe7a3aa 48%,transparent 62%)}
.fcard.coach{background:linear-gradient(155deg,#2b3f78,#13306b 50%,#0b1a3d);color:#ffd970}
.fc-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff70 48%,transparent 60%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
.mini .fc-shine{display:none}
@keyframes shine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.fc-top{position:absolute;left:11%;top:10.5%;text-align:center;line-height:1;z-index:1}
.fc-ovr{font-size:2.4em;font-weight:900;letter-spacing:-.04em}
.fc-pos{font-size:.95em;font-weight:800;margin-top:.1em}
.fc-club{margin-top:.5em;font-size:.68em;font-weight:900;border:.13em solid currentColor;border-radius:.35em;padding:.15em .25em}
.fc-flag{font-size:1.05em;margin-top:.3em;line-height:1}
.fc-face{position:absolute;right:6%;top:8%;width:60%;height:48%}
.fc-face svg{width:100%;height:100%}
.fc-img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:drop-shadow(0 2px 3px #0005);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.mini .fc-face{top:26%}
.fc-name{position:absolute;top:54%;left:8%;right:8%;text-align:center;font-weight:900;font-size:1.08em;text-transform:uppercase;letter-spacing:.02em;padding-bottom:.25em;border-bottom:.07em solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-stats{position:absolute;top:65%;left:15%;right:11%;display:grid;grid-template-columns:1fr 1fr;column-gap:.6em;row-gap:0;font-size:.76em}
.fc-stats span{display:flex;gap:.35em;align-items:baseline}
.fc-stats b{font-weight:900;font-size:1.12em;min-width:1.3em}
.fc-coach{position:absolute;top:66%;left:8%;right:8%;text-align:center;font-weight:800;font-size:.85em}
.fc-coach small{display:block;font-weight:500;font-size:.8em;opacity:.8;margin-top:.3em}
.fc-tag{position:absolute;bottom:5.2%;width:100%;text-align:center;font-size:.52em;font-weight:900;letter-spacing:.15em;opacity:.6}
.mini .fc-top{left:9%;top:11%}
.mini .fc-ovr{font-size:2.6em}
.mini .fc-pos{font-size:1.15em}
.mini .fc-face{top:30%;right:0;width:100%;height:60%}
.slot.has{width:auto}
.slot.has .fcard{margin:0 auto;filter:drop-shadow(0 3px 4px #0009)}
.slot.has .nm{margin-top:2px}
.cardbtn{border:0;background:none;padding:0;margin-right:4px;cursor:pointer}
.cardm{background:#000000e6}
.cardm .cm-box{display:flex;flex-direction:column;align-items:center;max-width:320px;width:100%}
.cm-card{filter:drop-shadow(0 10px 30px #000c)}
.cm-info{text-align:center;font-size:14px;line-height:1.6;margin:14px 0 4px;color:#dfe7ff}
.cm-box .mbtns{width:100%}
.cm-palm{margin-top:8px;font-size:13px;line-height:1.5;color:#dfe7ff}
.rar{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;margin-bottom:4px;text-transform:uppercase}
.r-bronze{background:#8d5627;color:#fff}.r-silver{background:#97a1ad;color:#111}.r-gold{background:#c39531;color:#111}.r-icon{background:#f0e5c4;color:#3d2d06}.r-myth{background:linear-gradient(90deg,#ff6ad5,#6ad5ff,#ffe76a);color:#111}
.pk-rar{position:relative;font-weight:900;letter-spacing:.2em;font-size:15px;padding:5px 16px;border-radius:999px;margin-bottom:14px;text-transform:uppercase;animation:pop .5s .3s both}
.rays.myth{background:repeating-conic-gradient(#ff6ad533 0 6deg,transparent 6deg 12deg,#6ad5ff33 12deg 18deg,transparent 18deg 24deg)}
.cm-note{font-size:11px;color:var(--mute);text-align:center;margin-top:10px}
.flip-in{animation:flipIn .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flipIn{0%{transform:perspective(600px) rotateY(100deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.slide-in{animation:slideIn .45s ease-out both}
@keyframes slideIn{0%{transform:translateX(-120%) rotate(-12deg)}100%{transform:none}}
.glow{animation:flipIn .7s cubic-bezier(.2,.9,.3,1.2) both,glow 1.2s ease-in-out .7s infinite alternate}
@keyframes glow{to{filter:brightness(1.18) drop-shadow(0 0 14px #ffe48a)}}
.fx{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.fx.open{display:flex}
.fx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 70%,transparent),#000d 70%);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.fx-label{position:relative;font-size:46px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 18px var(--c),0 4px 0 #0008;letter-spacing:2px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;margin-bottom:10px}
.fx-label.save{font-size:38px}
.fx-label.motm{font-size:26px;color:#ffd970;text-shadow:0 0 16px #c9a227}
@keyframes pop{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
.fx-card{position:relative;filter:drop-shadow(0 12px 30px #000)}
.fx-sub{position:relative;color:#fff;font-weight:700;margin-top:12px;font-size:15px;animation:fade .5s .4s both}
.fx-assist{position:relative;display:flex;align-items:center;gap:10px;margin-top:12px;color:#fff;font-size:13px;animation:slideIn .5s .6s both}
.stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);border:5px solid #ff2a2a;color:#ff2a2a;font-weight:900;font-size:30px;padding:4px 12px;border-radius:8px;background:#fff9;animation:stamp .4s .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-18deg) scale(3);opacity:0}100%{opacity:1}}
.shake{animation:shake .5s .9s both}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s linear both}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(#ffd97022 0 6deg,transparent 6deg 18deg);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nr{cursor:pointer}
.coins{position:absolute;left:12px;top:8px;font-size:12px;font-weight:800;color:#ffd970;background:var(--carte);border:1px solid #6b5a1e;border-radius:999px;padding:5px 10px;cursor:pointer}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkbtn{border:0;border-radius:14px;padding:14px 6px;cursor:pointer;color:#1b1406;background:linear-gradient(160deg,#fff 0%,var(--pc) 45%,#6d4f17 120%);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px #0007;font-family:inherit}
.pkbtn.daily{width:100%;flex-direction:row;justify-content:space-between;padding:14px 16px;margin-bottom:8px;animation:glow 1.2s ease-in-out infinite alternate}
.pkbtn b{font-size:13px}.pkbtn span{font-size:10.5px;opacity:.8}.pkbtn em{font-style:normal;font-weight:900;font-size:14px;margin-top:2px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;justify-items:center}
.slotc{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.slotc .no{font-size:10px;color:var(--mute);margin-bottom:2px}
.slotc.locked .fcard{filter:grayscale(1) brightness(.35)}
.slotc .q{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffffff55}
.slotc .cnt{position:absolute;top:14px;right:2px;background:var(--rouge);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 6px}
.slotc .an{font-size:11px;color:#c8d6ff;margin-top:3px;text-align:center;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotc.locked .an{color:#6b7aa6}
.packfx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column}
.packfx.open{display:flex}
.pk-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1d4aa0,#050b1d 75%)}
.pk-pack{position:relative;width:190px;height:270px;border-radius:16px;background:linear-gradient(150deg,#fff,var(--pc) 40%,#5b4214);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1406;box-shadow:0 20px 50px #000c;cursor:pointer;animation:pkShake 1.1s ease-in-out infinite;overflow:hidden}
.pk-pack b{font-size:64px;font-weight:900;letter-spacing:-2px}.pk-pack span{font-weight:900;font-size:17px}.pk-pack small{margin-top:24px;font-size:11px;opacity:.7}
.pk-foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff9 45%,transparent 60%);animation:shine 2.2s linear infinite}
@keyframes pkShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) scale(1.02)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg) scale(1.03)}}
.pk-pack.tear{animation:pkTear .7s ease-in forwards}
@keyframes pkTear{0%{transform:scale(1)}40%{transform:scale(1.15) rotate(4deg);filter:brightness(1.6)}100%{transform:scale(2.2);opacity:0;filter:brightness(3)}}
.pk-show{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.pk-card{position:relative;filter:drop-shadow(0 14px 34px #000)}
.pk-new{position:relative;margin-top:16px;font-weight:900;font-size:22px;color:#7ee2a0;text-shadow:0 0 12px #1f8a4c;animation:pop .5s .5s both}
.pk-dup{position:relative;margin-top:16px;font-weight:700;color:var(--mute);animation:fade .5s .5s both}
.pk-hint{position:relative;margin-top:14px;font-size:12px;color:#c8d6ff;opacity:.7}
.walk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#02040c;overflow:hidden;cursor:pointer}
.wo-beam{position:absolute;left:50%;top:-10%;width:140px;height:130%;transform:translateX(-50%);background:linear-gradient(180deg,transparent,var(--wc),transparent);filter:blur(18px);opacity:0;animation:beam 1.2s .1s ease-out forwards}
.walk.gold{--wc:#ffd970}.walk.icon{--wc:#fff2c8}.walk.myth{--wc:#d07bff}
@keyframes beam{0%{opacity:0;width:4px}60%{opacity:1}100%{opacity:.85;width:180px}}
.walk.myth .wo-beam{background:linear-gradient(180deg,transparent,#ff6ad5,#6ad5ff,#ffe76a,transparent)}
.wo-stage{position:relative;text-align:center;color:#fff}
.wo-item{animation:woIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes woIn{0%{transform:scale(2.5);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
.wo-big{font-size:72px;font-weight:900;line-height:1;text-shadow:0 0 30px var(--wc)}
.wo-flag{font-size:96px}
.wo-small{margin-top:12px;font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e8eeff}
.wo-skip{position:absolute;bottom:40px}
.walk.boom{animation:boom .45s ease-in forwards}
@keyframes boom{0%{background:#02040c}50%{background:#fff}100%{opacity:0;background:#fff}}
.pk-pack.gold-charge{animation:goldCharge 1.9s ease-in forwards}

const fitsRole=(p,role)=>p.pos.some(x=>(ROLE_OK[role]||[]).includes(x));
function ownedPlayers(){ const own=W().coll||{}; return Object.keys(own).filter(id=>own[id]>0&&BY_ID[id]&&BY_ID[id].pos[0]!=="COACH"); }
function bestCompo(form){ const roles=F[form], ids=ownedPlayers(), pairs=[];
  roles.forEach(([r],i)=>ids.forEach(id=>{ const p=BY_ID[id]; if(fitsRole(p,r)) pairs.push([effR(id)+(ROLE_OK[r].includes(p.pos[0])?0.5:0),id,i]); }));
  pairs.sort((a,b)=>b[0]-a[0]); const slots={}, bases=new Set();
  for(const [,id,i] of pairs){ if(slots[i]||bases.has(baseOf(id))) continue; slots[i]=id; bases.add(baseOf(id)); }
  const bench={}; ids.filter(id=>!bases.has(baseOf(id))).sort((a,b)=>effR(b)-effR(a)).forEach(id=>{ if(Object.keys(bench).length>=BENCH_N||bases.has(baseOf(id))) return; bench[Object.keys(bench).length]=id; bases.add(baseOf(id)); });
  const own=W().coll||{}; const coach=COACHES.filter(c=>own[c.id]).sort((a,b)=>b.ovr-a.ovr)[0];
  return {slots,bench,coach:coach?coach.id:null}; }
function suggestions(){ const c=W(), roles=F[c.formation]; const xiBase=new Set(Object.values(c.slots).filter(Boolean).map(baseOf)); const S=[];
  roles.forEach(([r],i)=>{ const cur=c.slots[i]; const curV=cur?effR(cur):0; let best=null;
    for(const id of ownedPlayers()){ if(xiBase.has(baseOf(id))) continue; if(!fitsRole(BY_ID[id],r)) continue; const v=effR(id); if(v>curV&&(!best||v>best.v)) best={id,v}; }
    if(best) S.push({i,role:r,cur,curV,id:best.id,v:best.v,gain:best.v-curV}); });
  const own=c.coll||{}; const bc=COACHES.filter(x=>own[x.id]).sort((a,b)=>b.ovr-a.ovr)[0];
  if(bc&&bc.id!==c.coach&&bc.ovr>(c.coach&&BY_ID[c.coach]?BY_ID[c.coach].ovr:0)) S.push({coach:true,cur:c.coach,curV:c.coach?BY_ID[c.coach].ovr:0,id:bc.id,v:bc.ovr,gain:bc.ovr-(c.coach?BY_ID[c.coach].ovr:0)});
  // un même joueur ne peut être suggéré qu'une fois (au poste où il apporte le plus)
  S.sort((a,b)=>b.gain-a.gain); const seen=new Set(); return S.filter(x=>{ if(seen.has(x.id)) return false; seen.add(x.id); return true; }); }
let autoPrev=null, autoArm=false;
function renderSugg(mine){ const el=$("#sugg"); if(!el) return; el.style.display=mine?"":"none"; if(!mine){ el.innerHTML=""; return; }
  const S=suggestions(); const short2=id=>id&&BY_ID[id]?esc(BY_ID[id].name):"vide";
  el.innerHTML=`<div class="sgh"><b>💡 Suggestions</b><span>${autoPrev?`<button class="btn sm ghost" id="autoUndo">↩️ Annuler</button> `:""}<button class="btn sm" id="autoBtn">⚡ Compo auto</button></span></div>`+
    (S.length?S.slice(0,4).map((x,k)=>`<div class="sgl"><span>${x.coach?"🧠 Entraîneur":`<b>${x.role}</b>`} : ${x.cur?`${short2(x.cur)} <small>(${x.curV})</small> → `:""}<b>${short2(x.id)}</b> <small>(${x.v})</small> <em>${x.cur?"+"+x.gain:"poste vide"}</em></span><button class="btn sm ghost" data-sg="${k}">Mettre</button></div>`).join("")
     :`<div class="mute" style="font-size:12.5px">✅ Ton 11 est déjà le meilleur possible avec tes cartes.</div>`);
  el.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{ const x=S[+b.dataset.sg], c=W();
    if(x.coach) c.coach=x.id; else { for(const k in c.bench) if(c.bench[k]===x.id){ if(x.cur) c.bench[k]=x.cur; else delete c.bench[k]; } c.slots[x.i]=x.id; }
    c.loadedId=null; render(); save(); toast("✅ "+BY_ID[x.id].name+" mis dans ton 11"); });
  $("#autoBtn").onclick=e=>{ if(!autoArm){ autoArm=true; e.target.textContent="Remplacer mon 11 ? Re-touche"; setTimeout(()=>{ autoArm=false; const b=$("#autoBtn"); if(b) b.textContent="⚡ Compo auto"; },3000); return; }
    autoArm=false; const c=W(); const B=bestCompo(c.formation); if(!Object.keys(B.slots).length){ toast("Pas assez de cartes : ouvre des packs !",true); return; }
    autoPrev={slots:{...c.slots},bench:{...c.bench},coach:c.coach}; c.slots=B.slots; c.bench=B.bench; if(B.coach) c.coach=B.coach; c.loadedId=null; render(); save(); toast(`⚡ Meilleure compo en ${c.formation} mise en place`); };
  const u=$("#autoUndo"); if(u) u.onclick=()=>{ const c=W(); Object.assign(c,autoPrev); autoPrev=null; render(); save(); toast("↩️ Ancienne compo remise"); };
}

  const bench=$("#bench"); bench.innerHTML="";

  const co=$("#coach"); co.innerHTML=""; co.appendChild(slotBtn("coach",0,"COACH",c.coach,mine));

function renderCompare(){
  const ob = viewing!==me ? viewing : others().sort((x,y)=>filled(C(y))-filled(C(x)))[0];
  if(!ob){ $("#compare").innerHTML=`<h3>Face à face</h3><div style="font-size:13px;color:var(--mute)">Invite quelqu'un avec le bouton « Inviter » de l'accueil pour comparer vos compos.</div>`; return; }
  const a=C(me), b=C(ob);
  const all=c=>new Set([...Object.values(c.slots),...Object.values(c.bench)].filter(Boolean));
  const sa=all(a), sb=all(b);
  const common=[...sa].filter(x=>sb.has(x)).map(x=>BY_ID[x]?.name).filter(Boolean);
  const la=F[a.formation].map(([r],i)=>({r,p:BY_ID[a.slots[i]]})), lb=F[b.formation].map(([r],i)=>({r,p:BY_ID[b.slots[i]]}));
  const cell=(x,s)=>`<div class="${x.p&&s.has(x.p.id)?"same":""}">${esc(x.r)} · ${x.p?esc(x.p.name):"—"}</div>`;
  let h=`<h3>Face à face</h3>`;
  h+=`<div style="font-size:13px;margin-bottom:8px">${common.length?`<span class="same">${common.length} joueur(s) en commun :</span> ${esc(common.join(", "))}`:"Aucun joueur en commun pour l'instant."}</div>`;
  h+=`<div class="crow head"><div></div><div>${esc(NAMES[me])} (${esc(a.formation)})</div><div>${esc(NAMES[ob])} (${esc(b.formation)})</div></div>`;
  for(let i=0;i<11;i++) h+=`<div class="crow"><div class="p">${i+1}</div>${cell(la[i],sb)}${cell(lb[i],sa)}</div>`;
  for(let i=0;i<BENCH_N;i++){ const x={r:"R"+(i+1),p:BY_ID[a.bench[i]]}, y={r:"R"+(i+1),p:BY_ID[b.bench[i]]}; if(x.p||y.p) h+=`<div class="crow"><div class="p">R${i+1}</div>${cell(x,sb)}${cell(y,sa)}</div>`; }
  const ca=BY_ID[a.coach], cb=BY_ID[b.coach];
  h+=`<div class="crow"><div class="p">🧠</div><div class="${ca&&cb&&ca===cb?"same":""}">${ca?esc(ca.name):"—"}</div><div class="${ca&&cb&&ca===cb?"same":""}">${cb?esc(cb.name):"—"}</div></div>`;
  $("#compare").innerHTML=h;
}

// ---------- Draft : 5 propositions aléatoires par case, raretés variées ----------
// Postes regroupés en 4 zones pour les propositions de draft : gardiens, défenseurs, milieux, attaquants
const ZONE={GB:"gk",DC:"def",DD:"def",DG:"def",PG:"def",PD:"def",MDC:"mid",MC:"mid",MOC:"mid",MG:"mid",MD:"mid",AG:"att",AD:"att",BU:"att"};
const zoneOK=(p,role)=>ZONE[p.pos[0]]===ZONE[role];
const OFFER_TIERS=[["bronze"],["silver"],["gold"],["icon","gold"],["myth","icon","gold","silver"]];
function draftOffer(kind,i,role){
  const key=kind+i; const d=draft; const mine=((d&&d.offers)||{})[me]||{};
  const taken=dTaken(d);
  if(mine[key]&&mine[key].some(id=>!taken[id])) return mine[key];
  const okR=kind==="xi"?(ROLE_OK[role]||[]):null;
  let base=(kind==="coach"?COACHES:PLAYERS).filter(p=>!taken[p.id]&&(!okR||zoneOK(p,role)));
  if(okR&&base.length<5) base=PLAYERS.filter(p=>!taken[p.id]&&p.pos.some(x=>okR.includes(x)));
  const used=new Set(), ids=[];
  const pickT=tiers=>{ for(const t of tiers){ const L=base.filter(p=>cardTier(p)===t&&!used.has(p.id)); if(L.length) return L[Math.floor(Math.random()*L.length)]; } return null; };
  for(const tiers of OFFER_TIERS){
    let p=null;
    if(tiers.length>1){ // dernières cases : tirage pondéré, chance de grosse carte
      const r=Math.random(); const order=tiers[0]==="myth"?(r<.1?["myth","icon","gold"]:r<.35?["icon","gold"]:r<.65?["gold","silver"]:["silver","bronze"]):(r<.4?["icon","gold"]:["gold","silver"]);
      p=pickT(order);
    } else p=pickT(tiers);
    if(!p) p=pickT(["bronze","silver","gold","icon","myth"]);
    if(p){ used.add(p.id); ids.push(p.id); }
  }
  dWrite({[`offers.${me}.${key}`]:ids});
  return ids;
}
function openSheet(kind,i,role,mode){
  editing={kind,i,role,mode:mode||"compo"}; $("#q").style.display="";
  $("#clearSlot").style.display=editing.mode==="draft"?"none":"";
  $("#shTitle").textContent= kind==="coach"?"Entraîneur" : kind==="bench"?`Remplaçant n°${i+1}` : `${ROLE_LABEL[role]||role} (${role})`;
  $("#q").value=""; chip = kind==="xi" ? "poste" : "tous";
  $("#q").placeholder= kind==="coach"?"Rechercher un entraîneur…":"Rechercher un joueur…";
  $("#sheet").classList.add("open"); $("#veil").classList.add("open");
  const isDraft=editing.mode==="draft"; $("#q").style.display=isDraft?"none":"";
  if(isDraft) editing.offer=draftOffer(kind,i,role);
  renderChips(); renderList();
}
function closeSheet(){ $("#sheet").classList.remove("open"); $("#veil").classList.remove("open"); editing=null; }
function renderChips(){
  const el=$("#chips"); el.innerHTML="";
  if(editing.kind==="coach"||editing.mode==="draft"){el.style.display="none";return;} el.style.display="flex";

}
function usedIds(){
  const c=compos[me]; const s=new Set();
  Object.entries(c.slots).forEach(([k,v])=>{ if(v && !(editing.kind==="xi"&&+k===editing.i)){ s.add(v); s.add(baseOf(v)); } });
  Object.entries(c.bench).forEach(([k,v])=>{ if(v && !(editing.kind==="bench"&&+k===editing.i)){ s.add(v); s.add(baseOf(v)); } });
  return s;
}
function renderList(){
  if(!editing) return;
  const q=slug($("#q").value.trim()).replace(/^-|-$/g,"");
  const isCoach=editing.kind==="coach";
  const ok = editing.kind==="xi" ? (ROLE_OK[editing.role]||[]) : [];
  let ps = isCoach ? COACHES.slice() : (editing.mode!=="draft"?[...PLAYERS,...VARIANTS]:PLAYERS).filter(p=>{
    if(q) return true;
    if(chip==="poste") return p.pos.some(x=>ok.includes(x));
    if(chip==="tous") return true;
    return p.pos.includes(chip);
  });
  if(q) ps=ps.filter(p=>p.id.replace(/^coach-/,"").includes(q));
  const clubPick=editing.mode!=="draft";
  if(editing.mode==="draft"&&editing.offer){ ps=editing.offer.map(id=>BY_ID[id]).filter(Boolean); }
  if(clubPick){ const own=C(me).coll||{}; ps=ps.filter(p=>own[p.id]); }
  if(clubPick) ps.sort((a,b)=>a.year-b.year||a.name.localeCompare(b.name,"fr"));
  const takenMap = editing.mode==="draft" ? dTaken(draft) : null;
  const used = takenMap ? new Set(Object.keys(takenMap)) : (isCoach?new Set():usedIds());
  const L=$("#list"); L.innerHTML="";
  if(!clubPick) L.insertAdjacentHTML("beforeend",`<div class="mute" style="font-size:12px;padding:6px 10px">🎲 5 joueurs tirés au sort pour ce poste, de raretés différentes. Choisis-en un !</div>`);
  if(clubPick) L.insertAdjacentHTML("beforeend",`<div class="mute" style="font-size:12px;padding:6px 10px">🔒 Mode Club : seules tes cartes apparaissent. Le Draft, lui, propose tous les joueurs.</div>`);
  if(clubPick){ const cc=compos[me]||{}; const curId=editing.kind==="xi"?(cc.slots||{})[editing.i]:editing.kind==="bench"?(cc.bench||{})[editing.i]:cc.coach;
    ps=ps.filter(p=>p.id!==curId&&!(used.has(p.id)||used.has(baseOf(p.id)))); } // ni le joueur déjà en place, ni ceux déjà alignés
  if(!ps.length){L.insertAdjacentHTML("beforeend",`<div style="padding:18px 16px;text-align:center;color:var(--mute)">${clubPick?(q?"Aucune de tes cartes ne correspond à ta recherche.":`<b style="color:#fff">Aucun joueur dispo à ce poste</b><br>Ouvre des packs dans 🎴 Collec pour en débloquer, ou touche « Tous » pour voir tes autres cartes.`):"Personne trouvé."}</div>`);return;}
  for(const p of ps){
    const isUsed=used.has(p.id)||used.has(baseOf(p.id)); const d=document.createElement("div"); d.className="pl"+(isUsed?" used":"");
    d.innerHTML=`<span class="n">${esc(p.name)}<span class="yr"><span class="rar r-${cardTier(p)}" style="font-size:9px;padding:0 5px;margin:0 4px 0 0">${TIER_NAME[cardTier(p)]}</span>${!isCoach&&editing.kind==="xi"?hpTxt(p,editing.role):""}${isCoach?"":`arrivé en ${p.year<2000?"avant 2000":p.year} · ${p.m!=null?`${p.m} matchs · ${p.g} but${p.g>1?"s":""} · `:""}`}note <b style="color:${p.ovr>=85?"#ffd970":p.ovr>=80?"#7ee2a0":"#c8d6ff"}">${p.ovr}</b></span>${isCoach&&COACH_SKILL[p.id]?`<span class="cskill">🧠 <b>${esc(COACH_SKILL[p.id].n)}</b> : ${esc(COACH_SKILL[p.id].d)}</span>`:""}${used.has(p.id)?`<span class="tk">${takenMap?(takenMap[p.id]===me?"dans ton équipe":"pris par "+NAMES[takenMap[p.id]]):"déjà dans ta compo"}</span>`:""}</span>`+(isCoach?"":`<span class="tags">${p.pos.map(x=>`<span class="tag ${ok.includes(x)?"cur":""}">${x}</span>`).join("")}</span>`);
    const cb=document.createElement("button"); cb.className="cardbtn"; cb.innerHTML=cardHTML(p.id,{w:30,mini:true}); cb.onclick=ev=>{ev.stopPropagation(); showCard(p.id,null);};
    d.prepend(cb);
    d.onclick=()=>{ if(!isUsed) setPick(p.id); };
    L.appendChild(d);
  }
}
function setPick(pid){
  if(editing && editing.mode==="draft"){ const e=editing; closeSheet(); if(pid) dPick(e.kind,e.i,pid); return; }
  const c=compos[me];
  if(editing.kind==="xi"){ if(pid) c.slots[editing.i]=pid; else delete c.slots[editing.i]; }
  else if(editing.kind==="bench"){ if(pid) c.bench[editing.i]=pid; else delete c.bench[editing.i]; }
  else c.coach=pid||null;
  closeSheet(); render(); save();
}

function snapshotOf(c,id,name){ return {id,name,formation:c.formation,slots:{...c.slots},bench:{...c.bench},coach:c.coach||null,savedAt:Date.now()}; }
function storeNamed(name,replaceId){
  if(!name){ toast("Donne un nom à ta compo",true); return false; }
  const c=compos[me]; const id=replaceId||Date.now().toString(36);

function suggestPrice(pid){
  const p=BY_ID[pid], t=cardTier(p); const min=SELL[t], max=SELL[t]*PMAX;

  return Math.max(min,Math.min(max,Math.round(v/5)*5||min));

const BPRICE={bronze:4,silver:7,gold:10,icon:14,myth:20};
const priceOf=pid=>BPRICE[cardTier(BY_ID[pid])];
const BOFFER_TIERS=[["bronze"],["bronze"],["silver"],["gold"],["myth","icon","gold","silver"]];
let budgets={}, dSub="classic", bView=null, bLast={};
const bKey=()=>"budget__"+pairKey(me,dOpp);
function bNorm(x,a,b){
  const pl=(x&&Array.isArray(x.players))?x.players:[a,b].sort();
  const d=Object.assign({mode:"budget",status:"lobby",budget:100,formation:"4-3-3",turn:null,teams:{},offers:{},opener:{},picks:[],cur:null,ready:{}},x||{}); d.players=pl; d.ready=d.ready||{};
  for(const w of pl){ d.teams[w]=Object.assign({slots:{},coach:null,spent:0},d.teams[w]||{}); d.teams[w].slots=d.teams[w].slots||{}; }
  d.offers=d.offers||{}; d.opener=d.opener||{}; d.picks=Array.isArray(d.picks)?d.picks:[]; if(!F[d.formation]) d.formation="4-3-3";
  return d;
}
const bSlots=d=>[...F[d.formation].map(([r],i)=>({key:"s"+i,i,role:r})),{key:"coach",i:-1,role:"COACH"}];
const bFilled=(d,w)=>Object.values(d.teams[w].slots).filter(Boolean).length+(d.teams[w].coach?1:0);
const bMinNeeded=(d,w,except)=>{ const left=bSlots(d).filter(s=>s.key!==except&&!(s.key==="coach"?d.teams[w].coach:d.teams[w].slots[s.i])).length; return left*BPRICE.bronze; };
const bTaken=d=>{ const t=new Set(); for(const w of d.players){ const T=d.teams[w]; Object.values(T.slots||{}).forEach(x=>x&&t.add(x)); if(T.coach) t.add(T.coach); } return t; };
function bGenOffer(d,s){
  const tk=bTaken(d);
  let base=(s.role==="COACH"?COACHES:PLAYERS).filter(p=>!tk.has(p.id)&&(s.role==="COACH"||zoneOK(p,s.role)));
  if(s.role!=="COACH"&&base.length<5) base=PLAYERS.filter(p=>!tk.has(p.id)&&p.pos.some(x=>(ROLE_OK[s.role]||[]).includes(x)));
  const used=new Set(), ids=[];
  const pickT=tiers=>{ for(const t of tiers){ const L=base.filter(p=>cardTier(p)===t&&!used.has(p.id)); if(L.length) return L[Math.floor(Math.random()*L.length)]; } return null; };
  for(const tiers of BOFFER_TIERS){
    let p; if(tiers.length>1){ const r=Math.random(); p=pickT(r<.08?["myth","icon","gold"]:r<.3?["icon","gold"]:r<.6?["gold","silver"]:["silver","bronze"]); } else p=pickT(tiers);
    if(!p) p=pickT(["bronze","silver","gold","icon","myth"]); if(p){ used.add(p.id); ids.push(p.id); } }
  return ids.sort((a,b)=>priceOf(a)-priceOf(b));
}
async function bWrite(obj,full){ const ref=db.collection("onzeol_drafts").doc(bKey()); try{ if(full) await ref.set(obj); else await ref.update(obj); }catch(e){ toast("Pas de connexion, réessaie",true); } }
function bPick(s,pid){
  const key=bKey(); const ref=db.collection("onzeol_drafts").doc(key);
  firebase.firestore().runTransaction(async tx=>{
    const snap=await tx.get(ref); const d=bNorm(snap.exists?snap.data():null,me,dOpp);
    if(d.status!=="running") throw new Error("La partie n'est pas en cours");
    if(d.turn!==me) throw new Error("Ce n'est pas ton tour");
    const tm=d.teams[me]; if(s.key==="coach"?tm.coach:tm.slots[s.i]) throw new Error("Case déjà remplie");
    const offer=d.offers[s.key]; if(!offer||!offer.includes(pid)) throw new Error("Joueur non proposé");
    if(bTaken(d).has(pid)) throw new Error("Ce joueur est déjà pris");
    if(d.v===2&&(!d.cur||d.cur.key!==s.key)) throw new Error("Choisis d'abord pour le poste en cours");
    const o=d.players.find(x=>x!==me); const otherPick=s.key==="coach"?d.teams[o].coach:d.teams[o].slots[s.i]; if(otherPick===pid) throw new Error("Déjà pris par l'adversaire");
    const price=priceOf(pid); if(tm.spent+price>d.budget) throw new Error("Budget insuffisant");
    if(d.budget-tm.spent-price<bMinNeeded(d,me,s.key)) throw new Error("Trop cher : il ne te resterait pas assez pour compléter l'équipe");
    if(s.key==="coach") tm.coach=pid; else tm.slots[s.i]=pid; tm.spent+=price;
    d.picks.push({by:me,pid,slot:s.key,price,at:Date.now()});
    const N=bSlots(d).length;
    if(d.v===2){ if(d.cur.first===me) d.turn=o; else { d.cur=null; d.turn=me; } if(bFilled(d,o)>=N&&bFilled(d,me)>=N){ d.status="done"; d.turn=null; d.cur=null; } }
    else if(bFilled(d,o)<N) d.turn=o; else if(bFilled(d,me)<N) d.turn=me; else { d.status="done"; d.turn=null; }
    tx.set(ref,d);
  }).catch(e=>toast(e.message||"Raté",true));
}
async function bOpen(s){
  // ouvre le poste : tire 5 joueurs partagés (si pas déjà ouvert)
  const d=bView; if(d.offers[s.key]) return d.offers[s.key];
  const ref=db.collection("onzeol_drafts").doc(bKey()); let ids=null;
  try{ await firebase.firestore().runTransaction(async tx=>{ const snap=await tx.get(ref); const x=bNorm(snap.data(),me,dOpp);
      if(x.offers[s.key]){ ids=x.offers[s.key]; return; }
      if(x.v===2&&(x.turn!==me||x.cur)) throw new Error("Ce n'est pas à toi d'ouvrir un poste");
      ids=bGenOffer(x,s); x.offers[s.key]=ids; x.opener[s.key]=me; if(x.v===2) x.cur={key:s.key,first:me}; tx.set(ref,x); }); }
  catch(e){ toast(e.message||"Raté",true); return null; }
  return ids;
}
function onBudgetData(all){
  budgets=all;
  for(const [k,x] of Object.entries(budgets)){ if(!x.players.includes(me)) continue; const n=(x.picks||[]).length;
    if(bLast[k]!=null&&n>bLast[k]){ const p=x.picks[n-1]; if(p.by!==me) toast(`💰 ${NAMES[p.by]||"?"} a pris ${BY_ID[p.pid]?.name} (${p.price} pts)`); if(x.status==="running"&&x.turn===me) setTimeout(()=>toast("💰 À toi de jouer en mode Budget !"),1500); }
    if(bLast[k]===0&&n===0&&x.status==="running") toast(x.turn===me?"💰 Partie Budget lancée : tu commences !":"💰 Partie Budget lancée");
    bLast[k]=n; }
  if(mode==="draft"&&dSub==="budget") renderBudget();
}

      const co=t.coach; return P+`<div class="bcoach">${co?`<button class="slot has" data-card="${co}" style="position:static;transform:none">${cardHTML(co,{w:54,mini:true})}<div class="nm">${esc(BY_ID[co].name)} · ${priceOf(co)}</div></button><div class="skl">🧠 ${esc(skillOf(co).n||"")}<small>${esc(skillOf(co).d||"")}</small></div>`:`<button class="slot empty" style="position:static;transform:none" ${w===me&&can?`data-bs="coach"`:""}><div class="shirt"><b>COA</b></div><div class="nm">${d.offers.coach?(d.opener.coach===me?"ouvert":"🎯 restants"):w===me&&can?"+ Ouvrir":"—"}</div></button><div class="skl mute">Entraîneur à choisir</div>`}</div>`; };

  el.innerHTML=`<div class="dbanner${can?" me":""}">${d.status==="done"?"🏁 Équipes complètes !":can?(d.v===2?(d.cur?`💰 À toi : choisis ton ${esc(bRoleName(d,d.cur.key))} parmi les 4 restants`:"💰 À toi d'ouvrir un poste et de choisir en premier"):"💰 À toi de choisir !"):`⏳ ${esc(NAMES[d.turn]||"?")} ${d.v===2&&!d.cur?"ouvre un poste…":"choisit…"}`}<small>${d.status==="done"?"Lance le match !":`Budget restant : ${left} / ${d.budget} pts · ${bFilled(d,me)}/${N} choisis`}</small></div>

function duoTeam(u1,u2){ const pool=new Map();
  for(const u of [u1,u2]){ const c=C(u)||{}, own=c.coll||{}; for(const id of [...Object.values(c.slots||{}),...Object.values(c.bench||{})]) if(id&&own[id]&&BY_ID[id]){ const v=BY_ID[id].ovr+evoOf(u,id)+liveMod(id); if(!pool.has(id)||pool.get(id).v<v) pool.set(id,{v,u}); } }
  const form=(C(u1)||{}).formation||"4-3-3"; const roles=F[form]||F["4-3-3"]; const pairs=[];
  roles.forEach(([r],i)=>pool.forEach((x,id)=>{ const p=BY_ID[id]; if(fitsRole(p,r)) pairs.push([x.v+(ROLE_OK[r].includes(p.pos[0])?.5:0),id,i]); }));
  pairs.sort((a,b)=>b[0]-a[0]); const slots={}, bases=new Set(); for(const [,id,i] of pairs){ if(slots[i]||bases.has(baseOf(id))) continue; slots[i]=id; bases.add(baseOf(id)); }
  const bench={}; [...pool.entries()].filter(([id])=>!bases.has(baseOf(id))).sort((a,b)=>b[1].v-a[1].v).slice(0,BENCH_N).forEach(([id],k)=>{ bench[k]=id; bases.add(baseOf(id)); });
  const co=[u1,u2].map(u=>{ const c=C(u)||{}; return c.coach&&(c.coll||{})[c.coach]?BY_ID[c.coach]:null; }).filter(Boolean).sort((a,b)=>b.ovr-a.ovr)[0];
  return {formation:form,slots,bench,coach:co?co.id:null}; }
let duoSel={a:null,b:null,c:null};
function duoHTML(){ const us=Object.keys(NAMES).filter(u=>u!==me&&u!==CPU&&compos[u]); const opt=(k,lab)=>`<select data-du="${k}"><option value="">${lab}</option>${us.map(u=>`<option value="${u}"${duoSel[k]===u?" selected":""}>${esc(NAMES[u])}</option>`).join("")}</select>`;
  const ok=duoSel.a&&duoSel.b&&duoSel.c&&new Set([me,duoSel.a,duoSel.b,duoSel.c]).size===4;
  let pre=""; if(ok){ const A=strength(duoTeam(me,duoSel.a),null,false), B=strength(duoTeam(duoSel.b,duoSel.c),null,false); pre=`<div class="vsavg"><div><small>${esc(NAMES[me])} & ${esc(NAMES[duoSel.a])}</small><b>${A.global}</b></div><span>VS</span><div><small>${esc(NAMES[duoSel.b])} & ${esc(NAMES[duoSel.c])}</small><b>${B.global}</b></div></div>`; }
  return `<h3>👥 Duo · 2 contre 2</h3><div class="rules" style="font-size:12px;margin-top:0">Choisis ton coéquipier et vos 2 adversaires : chaque duo aligne <b>le meilleur 11 possible en mélangeant les 11 types et bancs des deux joueurs</b> (meilleur entraîneur des deux). Le match se joue en direct chez les 4.</div>
   <div class="duog"><div><small>Ton coéquipier</small>${opt("a","Choisir…")}</div><div><small>Adversaire 1</small>${opt("b","Choisir…")}</div><div><small>Adversaire 2</small>${opt("c","Choisir…")}</div></div>

// =================== 🔮 Pronostics sur les vrais matchs de l'OL ===================
let PREDS={};
const PRED_R={exact:150,res:50};
const fxOf=()=>((LIVE&&LIVE.fixtures)||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const fxOpen=f=>!f.score&&Date.now()<new Date(f.date).getTime();
const sgn=(a,b)=>Math.sign(a-b);
function predPts(p,sc){ if(!p||!sc) return null; return p[0]===sc[0]&&p[1]===sc[1]?"exact":sgn(p[0],p[1])===sgn(sc[0],sc[1])?"res":"rate"; }
function settlePreds(){ if(!me||!compos[me]) return; const c=W(); c.predDone=c.predDone||{}; let ch=false;
  for(const f of fxOf()){ if(!f.score||c.predDone[f.id]) continue; const p=(PREDS[f.id]||{})[me]; if(!p) continue; const r=predPts(p,f.score); c.predDone[f.id]=r; ch=true;
    if(r!=="rate") grant({coins:PRED_R[r]},`🔮 Prono ${f.home}–${f.away} ${r==="exact"?"score exact !":"bon résultat"}`); }
  if(ch) save(); }
async function sendPred(id,h,a){ const f=fxOf().find(x=>x.id===id); if(!f||!fxOpen(f)){ toast("Les pronos sont fermés pour ce match",true); return; }
  try{ await db.runTransaction(async tx=>{ const ref=db.collection("onzeol_meta").doc("preds"); const d=await tx.get(ref); const x=d.exists?d.data():{}; x[id]=Object.assign({},x[id]||{},{[me]:[h,a]}); tx.set(ref,x); }); toast(`🔮 Prono enregistré : ${f.home} ${h}-${a} ${f.away}`); }
  catch(e){ toast("Prono non enregistré",true); } }
function predHTML(){ const F_=fxOf(); const c=W(); const done=c.predDone||{};
  const up=F_.filter(f=>!f.score).slice(0,3), past=F_.filter(f=>f.score).slice(-3).reverse();
  const nm=u=>esc(NAMES[u]||"?");
  const row=f=>{ const P=PREDS[f.id]||{}; const mine=P[me]; const open=fxOpen(f); const d=new Date(f.date);
    const when=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
    return `<div class="pred"><div class="ph"><b>${esc(f.home)} – ${esc(f.away)}</b><small>${esc(f.comp||"")} · ${when}</small></div>
      ${open?`<div class="pin"><input type="number" min="0" max="9" inputmode="numeric" id="ph_${f.id}" value="${mine?mine[0]:""}" placeholder="0"><span>-</span><input type="number" min="0" max="9" inputmode="numeric" id="pa_${f.id}" value="${mine?mine[1]:""}" placeholder="0"><button class="btn sm" data-pr="${f.id}">${mine?"Modifier":"Valider"}</button></div>
        <div class="mute" style="font-size:12px">${Object.keys(P).length} prono${Object.keys(P).length>1?"s":""} · fermé au coup d'envoi · ${mine?"les autres pronos seront visibles après le coup d'envoi":"pas encore de prono"}</div>`
      :`<div class="mute" style="font-size:12.5px">${f.score?`Score final : <b style="color:#fff">${f.score[0]}-${f.score[1]}</b>`:"⏱️ Match en cours / à venir — pronos fermés"}</div>
        <div class="plist">${Object.entries(P).map(([u,p])=>{ const r=f.score?predPts(p,f.score):null; return `<span class="${r||""}">${nm(u)} ${p[0]}-${p[1]}${r==="exact"?" 🎯":r==="res"?" ✅":r==="rate"?" ❌":""}</span>`; }).join("")||`<span class="mute">Aucun prono</span>`}</div>`}</div>`; };
  // classement des pronos (tous les matchs terminés)
  const T={}; for(const f of F_.filter(x=>x.score)) for(const [u,p] of Object.entries(PREDS[f.id]||{})){ const r=predPts(p,f.score); T[u]=(T[u]||0)+(r==="exact"?3:r==="res"?1:0); }
  const top=Object.entries(T).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<h3>🔮 Pronostics OL</h3><div class="rules" style="font-size:12px;margin-top:0">Devine le score des vrais matchs de l'OL. Score exact : <b>${PRED_R.exact} 🪙</b> · bon résultat : <b>${PRED_R.res} 🪙</b>.</div>
    ${up.map(row).join("")||`<div class="mute" style="font-size:13px">Prochains matchs bientôt affichés.</div>`}
    ${past.length?`<h4>Derniers résultats</h4>${past.map(row).join("")}`:""}
    ${top.length?`<h4>🏅 Meilleurs pronostiqueurs</h4><div class="plist">${top.map(([u,n],i)=>`<span>${["🥇","🥈","🥉","4.","5."][i]} ${nm(u)} · ${n} pt${n>1?"s":""}</span>`).join("")}</div>`:""}`; }
function bindPred(){ document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{ const id=b.dataset.pr; const h=+$("#ph_"+id).value, a=+$("#pa_"+id).value;
  if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0||$("#ph_"+id).value===""||$("#pa_"+id).value===""){ toast("Mets un score pour les deux équipes",true); return; } sendPred(id,h,a); }); }

function sbcPick(s){
  // choisit les doublons les moins précieux qui remplissent chaque groupe
  const avail=Object.fromEntries(dupesOf(me).map(x=>[x.id,x.n])); const chosen={};
  for(const g of s.req){ const cand=Object.keys(avail).filter(id=>avail[id]>0&&g.f(BY_ID[id])).sort((a,b)=>TPTS[cardTier(BY_ID[a])]-TPTS[cardTier(BY_ID[b])]||BY_ID[a].ovr-BY_ID[b].ovr);
    let need=g.n; for(const id of cand){ while(need>0&&avail[id]>0){ avail[id]--; chosen[id]=(chosen[id]||0)+1; need--; } if(!need) break; }
    if(need>0) return null; }
  return chosen;
}

function standings(L){
  const T={}; (L.members||[]).forEach(id=>T[id]={id,j:0,v:0,n:0,d:0,bp:0,bc:0});
  for(const f of L.fix||[]){ if(!f.s||!T[f.a]||!T[f.b]) continue; const [a,b]=f.s;
    for(const [id,gf,ga] of [[f.a,a,b],[f.b,b,a]]){ const r=T[id]; r.j++; r.bp+=gf; r.bc+=ga; if(gf>ga) r.v++; else if(gf<ga) r.d++; else r.n++; } }
  return Object.values(T).sort((p,q)=>(q.v*3+q.n)-(p.v*3+p.n)||(q.bp-q.bc)-(p.bp-p.bc)||q.bp-p.bp);
}
function roundRobin(P){ const L=P.slice(); if(L.length%2) L.push(null); const n=L.length, R=[];
  for(let r=0;r<n-1;r++){ const ties=[]; for(let i=0;i<n/2;i++){ const a=L[i], b=L[n-1-i]; if(a&&b) ties.push(r%2?[b,a]:[a,b]); } R.push(ties); L.splice(1,0,L.pop()); }
  return R; }
function claimLeague(){
  const c=W(); c.lgDone=c.lgDone||[]; let changed=false;
  for(const [id,L] of Object.entries(leagues)){
    if(L.status!=="done"||c.lgDone.includes(id)||!(L.members||[]).includes(me)) continue;
    c.lgDone.push(id); changed=true;
    const S=standings(L); const i=S.findIndex(r=>r.id===me);
    if(S.length>=2&&i>=0&&i<3){ grant(LEAGUE_R[i],`Championnat « ${L.name} » : ${i+1}${i?"e":"er"}`); if(i===0) post(`🏆 ${NAMES[me]} remporte le championnat « ${L.name} » !`); changed=false; }
  }
  c.lgDone=c.lgDone.slice(-60); if(changed) save();
}

async function lgTx(id,fn){ const ref=db.collection("onzeol_leagues").doc(id);
  try{ let out; await db.runTransaction(async tx=>{ const d=await tx.get(ref); if(!d.exists) throw new Error("Championnat introuvable"); const u=fn(d.data()); if(u==null) throw new Error("skip"); out=u; tx.update(ref,u); }); return out; }

async function startLeague(id){
  const ok=await lgTx(id,L=>{ if(L.owner!==me||(L.status&&L.status!=="open")) throw new Error("Impossible"); const P=(L.members||[]).slice().sort(()=>Math.random()-.5);
    if(P.length<2) throw new Error("Il faut au moins 2 joueurs");
    let R=roundRobin(P); if(P.length<=4) R=[...R,...R.map(t=>t.map(([a,b])=>[b,a]))]; // aller-retour si peu de joueurs
    const now=Date.now(), dur=(L.days||7)*86400000, gap=Math.max(3600000,Math.floor(dur/R.length));
    const fix=[]; R.forEach((ties,r)=>ties.forEach(([a,b])=>fix.push({r:r+1,a,b,t:now+60000+r*gap,s:null,mid:null})));
    return {status:"running",fix,start:now,end:fix[fix.length-1].t}; });
  if(ok){ post(`🏆 Le championnat « ${leagues[id]?.name||""} » commence ! ${new Set(ok.fix.map(f=>f.r)).size} journées, matchs joués automatiquement.`); toast("C'est parti ! La 1re journée se joue dans une minute."); }

let autoBusy=false;

function autoSides(a,b,label){ const ca=C(a)||{}, cb=C(b)||{}; const A=strength(ca,a,true), B=strength(cb,b,true);
  return [{c:ca,S:A,label,owner:a,name:NAMES[a]||"?"},{c:cb,S:B,label,owner:b,name:NAMES[b]||"?"}]; }
function forfeitScore(sd){ const ok=sd.map(x=>enough(x.S)); if(ok[0]&&ok[1]) return null; if(!ok[0]&&!ok[1]) return [0,0]; return ok[0]?[3,0]:[0,3]; }
async function autoPlay(){
  if(autoBusy||!me||!db) return; autoBusy=true; const now=Date.now();
  try{
    // Championnats
    for(const [id,L] of Object.entries(leagues)){
      if(L.status!=="running"||!(L.members||[]).includes(me)) continue;
      for(let i=0;i<(L.fix||[]).length;i++){ const f=L.fix[i]; if(f.s||f.t>now) continue;
        const sd=autoSides(f.a,f.b,`🏆 ${L.name} · J${f.r}`); const ff=forfeitScore(sd); let m=null, sc=ff;
        if(!ff){ m=buildMatch(sd); sc=m.score; }
        const res=await lgTx(id,X=>{ const g=X.fix[i]; if(!g||g.s) return null; g.s=sc; g.mid=m?m.id:null; const out={fix:X.fix}; if(X.fix.every(z=>z.s)) out.status="done"; return out; });
        if(res&&m){ m.at=f.t; await saveReplay(m); await addHist(histOf(m,{lg:id})); post(`⚽ ${L.name} (J${f.r}) : ${NAMES[f.a]} ${sc[0]}-${sc[1]} ${NAMES[f.b]}`); }
        else if(res&&ff) post(`⚽ ${L.name} (J${f.r}) : ${NAMES[f.a]} ${sc[0]}-${sc[1]} ${NAMES[f.b]} (forfait : moins de 7 joueurs)`);
      }
    }
    // Coupes : une manche toutes les 12 h après le tirage
    for(const [id,K] of Object.entries(cups)){
      if(K.status!=="running"||!(K.members||[]).includes(me)) continue;
      const ri=K.rounds.length-1, R=K.rounds[ri];
      for(let ti=0;ti<R.ties.length;ti++){ const T=R.ties[ti]; if(T.w) continue; const k=T.legs.length; if(cupLegTime(K,ri,k)>now) continue;
        await autoTie(id,ri,ti,k); }
    }
  }catch(e){} autoBusy=false;
}

function genTeam(lo,hi,R,formation){
  R=R||Math.random; const forms=Object.keys(F); formation=formation||forms[Math.floor(R()*forms.length)];
  const used=new Set(), slots={};
  F[formation].forEach(([role],i)=>{ const ok=ROLE_OK[role]||[]; let L=PLAYERS.filter(p=>!used.has(p.id)&&p.pos.some(x=>ok.includes(x))&&p.ovr>=lo&&p.ovr<=hi);
    if(!L.length) L=PLAYERS.filter(p=>!used.has(p.id)&&p.pos.some(x=>ok.includes(x))).sort((a,b)=>Math.abs(a.ovr-(lo+hi)/2)-Math.abs(b.ovr-(lo+hi)/2)).slice(0,4);
    const p=L[Math.floor(R()*L.length)]; used.add(p.id); slots[i]=p.id; });
  let CL=COACHES.filter(c=>c.ovr>=lo-4&&c.ovr<=hi+2); if(!CL.length) CL=COACHES;

function rankApply(R,h){ R.months=R.months||{}; R.h2h=R.h2h||{}; const mk=MONTHK(h.at); const M=R.months[mk]=R.months[mk]||{};
  const [a,b]=h.owners, [x,y]=h.score; for(const [u,gf,ga] of [[a,x,y],[b,y,x]]){ const r=M[u]=M[u]||{p:0,w:0,d:0,l:0,j:0,bp:0,bc:0}; r.j++; r.bp+=gf; r.bc+=ga; if(gf>ga){r.w++;r.p+=3;} else if(gf===ga){r.d++;r.p+=1;} else r.l++; }

const CLUB_ROLES=["GB","DG","DC","DC","DD","MC","MDC","MC","AG","BU","AD"];
const clubSlug=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function clubTeam(club){
  const L=CLUB_XI[club]; if(!L) return null; const cs=clubSlug(club); const slots={};
  const [cn,co]=L[0].split("|"); const cid="x-"+cs+"-coach"; BY_ID[cid]=BY_ID[cid]||{id:cid,name:cn,pos:["COACH"],ovr:+co,year:2026,ext:true};
  L.slice(1).forEach((x,i)=>{ const [n,o]=x.split("|"); const id="x-"+cs+"-"+clubSlug(n); BY_ID[id]=BY_ID[id]||{id,name:n,pos:[CLUB_ROLES[i]],ovr:+o,year:2026,m:null,g:null,ext:true}; slots[i]=id; });
  return {formation:"4-3-3",slots,bench:{},coach:cid};
}
const clubAvg=club=>{ const L=CLUB_XI[club]; return L?Math.round(L.slice(1).reduce((a,x)=>a+ +x.split("|")[1],0)/11):0; };

const careerOpp=i=>clubTeam(CAREER[i].n)||genTeam(CAREER[i].r[0],CAREER[i].r[1],rng(hashS("carriere"+i)));
const CAREER_MAX=5; // matchs de carrière par jour
function careerState(){ const c=W(); return c.career=c.career||{lvl:0,best:0}; }
function careerLeft(){ const k=careerState(); if(k.day!==DAYK()){ k.day=DAYK(); k.n=0; } return CAREER_MAX-(k.n||0); }
async function careerPlay(){
  const k=careerState(); if(k.lvl>=CAREER.length) return; if(careerLeft()<=0){ toast(`Plus de match de carrière aujourd'hui (${CAREER_MAX}/jour) : reviens demain !`,true); return; } const i=k.lvl, O=CAREER[i];
  const mine=W(), A=strength(mine,me,true); if(!enough(A)){ toast("Il te faut au moins 7 joueurs possédés dans ton 11 type",true); return; }
  const oc=careerOpp(i), B=strength(oc,null,false);
  const m=buildMatch([{c:mine,S:A,label:"11 type",owner:me,name:NAMES[me]},{c:oc,S:B,label:O.comp,owner:CPU,name:O.n}]);
  k.n=(k.n||0)+1; const snap={lvl:k.lvl,best:k.best};
  const apply=m=>{ const [a,b]=m.score; if(a>b){ k.lvl=i+1; if(i+1>k.best){ k.best=i+1; later({coins:40+15*i},`Carrière : victoire contre ${O.n}`,m); if(CAREER_END[i]) later(CAREER_END[i],`🏆 ${O.comp} remportée`,m); if(i===CAREER.length-1) post(`🧗 ${NAMES[me]} a terminé la Carrière en battant le Real Madrid !`); } } };
  apply(m); save();
  playLocal(m,{t:0,c:mine,w:me,club:true,oc,OS:B,fin:(m2,changed)=>{ if(changed){ k.lvl=snap.lvl; k.best=snap.best; const c=W(); c.pend=(c.pend||[]).filter(p=>p.mid!==m2.id); apply(m2); } save(); saveReplay(m2); addHist(histOf(m2,{nr:1,mode:"carriere"})); }});
}

let cups={};
function onCups(all){ cups=all; if(me){ claimCups(); autoPlay(); if(mode==="jeux") renderJeux(); } }
function createCup(){
  openModal("Nom de la coupe","",[...[4,8].map(n=>[`${n} joueurs`,async v=>{
    if(!v){ toast("Donne un nom à la coupe",true); return false; }
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    try{ await db.collection("onzeol_cups").doc(id).set({name:v.slice(0,30),owner:me,size:n,members:[me],status:"open",rounds:[],created:Date.now()});
      post(`🏆 ${NAMES[me]} a créé la coupe « ${v.slice(0,30)} » (${n} joueurs). Inscrivez-vous dans Jeux !`); toast("Coupe créée ✓"); }catch(e){ toast("Création impossible",true); } }]),["Annuler",null,true]]);
}
async function cupTx(id,fn,quiet){ const ref=db.collection("onzeol_cups").doc(id);
  try{ await db.runTransaction(async tx=>{ const d=await tx.get(ref); if(!d.exists) throw new Error("Coupe introuvable"); const u=fn(d.data()); tx.update(ref,u); }); return true; }
  catch(e){ if(!quiet&&e.message!=="skip") toast(e.message&&e.message.length<60?e.message:"Impossible, réessaie",true); return false; } }
function joinCup(id,join){ return cupTx(id,K=>{ if(K.status!=="open") throw new Error("Inscriptions fermées"); const m=new Set(K.members||[]);
  if(join){ if(m.size>=K.size) throw new Error("Coupe complète"); m.add(me); } else m.delete(me); return {members:[...m]}; }).then(ok=>ok&&toast(join?"Inscrit ✓":"Désinscrit")); }
function startCup(id){ return cupTx(id,K=>{ if(K.owner!==me||K.status!=="open") throw new Error("Impossible"); if((K.members||[]).length!==K.size) throw new Error(`Il faut ${K.size} inscrits`);
  const P=K.members.slice().sort(()=>Math.random()-.5); const ties=[]; for(let i=0;i<P.length;i+=2) ties.push({a:P[i],b:P[i+1],legs:[],w:null});
  return {status:"running",rounds:[{ties}],start:Date.now()}; }).then(ok=>{ if(ok){ post(`🏆 Tirage de la coupe « ${cups[id]?.name||""} » effectué ! Les matchs se jouent automatiquement.`); toast("Tirage effectué ✓ : 1er match dans une minute"); } }); }
const CUP_GAP=12*3600000;
const cupLegTime=(K,ri,k)=>(K.start||K.created)+60000+(2*ri+k)*CUP_GAP;
function shootout(gA,gB){ const pA=.76-(gB-75)/250, pB=.76-(gA-75)/250; let a=0,b=0;
  for(let k=0;k<5;k++){ if(Math.random()<pA) a++; if(Math.random()<pB) b++; if(a>b+(4-k)||b>a+(4-k)) break; }
  let g=0; while(a===b&&g++<20){ const x=Math.random()<pA, y=Math.random()<pB; a+=x; b+=y; } if(a===b) a++; return [a,b]; }
async function autoTie(id,ri,ti,k){
  const K=cups[id]; const T=K.rounds[ri].ties[ti]; const [h,v]=k===0?[T.a,T.b]:[T.b,T.a];
  const sd=autoSides(h,v,`🏆 ${K.name} · ${k?"retour":"aller"}`); const ff=forfeitScore(sd); let m=null, sc=ff;
  if(!ff){ m=buildMatch(sd); sc=m.score; }
  const H=sd[0].S, V=sd[1].S;
  const ok=await cupTx(id,X=>{ const R=X.rounds, t=R[ri]&&R[ri].ties[ti]; if(!t||t.legs.length!==k||t.w) throw new Error("skip");
    const s2=k===0?[sc[0],sc[1]]:[sc[1],sc[0]]; t.legs.push({s:s2,mid:m?m.id:null});
    if(t.legs.length===2){ const ga=t.legs[0].s[0]+t.legs[1].s[0], gb=t.legs[0].s[1]+t.legs[1].s[1];
      if(ga!==gb) t.w=ga>gb?t.a:t.b; else { t.tab=shootout(H.gk,V.gk); t.w=t.tab[0]>t.tab[1]?t.b:t.a; } }
    const out={rounds:R};
    if(R[ri].ties.every(x=>x.w)){ const W2=R[ri].ties.map(x=>x.w);
      if(W2.length===1){ out.status="done"; out.winner=W2[0]; out.finalist=t.a===W2[0]?t.b:t.a; }
      else if(ri===R.length-1){ const ties=[]; for(let i=0;i<W2.length;i+=2) ties.push({a:W2[i],b:W2[i+1],legs:[],w:null}); R.push({ties}); } }
    return out; },true);
  if(!ok) return;
  if(m){ m.at=cupLegTime(K,ri,k); await saveReplay(m); await addHist(histOf(m,{cup:id})); }
  post(`🏆 ${K.name} (${RNAME(K.rounds[ri].ties.length)}, ${k?"retour":"aller"}) : ${NAMES[h]} ${sc[0]}-${sc[1]} ${NAMES[v]}${ff?" (forfait)":""}`);
}
function claimCups(){ const c=W(); c.cupDone=c.cupDone||[]; let ch=false;
  for(const [id,K] of Object.entries(cups)){ if(K.status!=="done"||c.cupDone.includes(id)) continue; if(K.winner!==me&&K.finalist!==me) continue;
    c.cupDone.push(id); ch=true;
    c.pend=c.pend||[]; const t=Date.now()+endDelay({len:95});
    if(K.winner===me){ c.pend.push({t,r:{pack:"legende",coins:300},why:`🏆 Vainqueur de la coupe « ${K.name} »`,trophy:K.name}); post(`🏆 ${NAMES[me]} remporte la coupe « ${K.name} » !`); }
    else c.pend.push({t,r:{pack:"or"},why:`🥈 Finaliste de la coupe « ${K.name} »`}); }
  if(ch){ c.cupDone=c.cupDone.slice(-40); save(); } }
function trophyFx(name){ const el=document.createElement("div"); el.className="trophy"; el.innerHTML=`<div><span>🏆</span><b>CHAMPION !</b><small>${esc(name)}</small></div>`; document.body.appendChild(el); el.onclick=()=>el.remove(); setTimeout(()=>el.remove(),6000); }
const RNAME=n=>n===1?"Finale":n===2?"Demi-finales":"Quarts de finale";
function cupHTML(){
  const L=Object.entries(cups).sort((x,y)=>y[1].created-x[1].created).filter(([,K])=>K.status!=="done"||Date.now()-K.created<21*86400000);
  const tieH=(id,K,ri,ti,T)=>{ const N=x=>esc(NAMES[x]||"?"); const ag=T.legs.length?[T.legs.reduce((s,l)=>s+l.s[0],0),T.legs.reduce((s,l)=>s+l.s[1],0)]:null;
    const mine=T.a===me||T.b===me; const nxt=!T.w&&K.status==="running"&&ri===K.rounds.length-1?cupLegTime(K,ri,T.legs.length):null;
    return `<div class="tie${T.w?" done":""}"><span class="${T.w===T.a?"win":""}">${N(T.a)}</span><b>${T.legs.map(l=>l.s.join("-")).join(" / ")||"–"}${ag&&T.legs.length===2?`<small>(${ag.join("-")}${T.tab?` · t.a.b ${T.tab[1]}-${T.tab[0]}`:""})</small>`:""}</b><span class="${T.w===T.b?"win":""}">${N(T.b)}</span>
      <div class="tieb">${T.legs.map((l,k)=>l.mid?`<button class="btn sm ghost" data-rp="${l.mid}">▶️ ${k?"Retour":"Aller"}</button>`:"").join("")}${nxt?`<small class="mute">${T.legs.length?"Retour":"Aller"} : ${fmtWhen(nxt)}</small>`:""}</div></div>`; };
  return `<h3>🏆 Coupes à élimination</h3><div class="rules" style="font-size:12px;margin-top:0">4 ou 8 joueurs, tirage au sort, matchs aller-retour avec vos 11 types (cartes possédées), <b>joués automatiquement toutes les 12 h</b> : revois les résumés avec ▶️. Égalité au total : tirs au but. Vainqueur : Pack Légende + 300 🪙, finaliste : Pack Épique.</div>
  <button class="btn big" id="jCupNew">➕ Créer une coupe</button>
  ${L.map(([id,K])=>`<div class="lg${(K.members||[]).includes(me)?" mine":""}"><div class="lgh"><b>${esc(K.name)}</b><small>${K.status==="open"?`Inscriptions ${K.members.length}/${K.size}`:K.status==="running"?"En cours":`Terminée · 🏆 ${esc(NAMES[K.winner]||"?")}`} · créée par ${esc(NAMES[K.owner]||"?")}</small></div>
    ${K.status==="open"?`<div class="mute" style="font-size:12px">${K.members.map(x=>esc(NAMES[x]||"?")).join(", ")}</div><div class="lgb">${K.members.includes(me)?(K.owner===me?"":`<button class="btn sm ghost" data-cq="${id}">Se désinscrire</button>`):K.members.length<K.size?`<button class="btn sm" data-cj="${id}">S'inscrire</button>`:""}${K.owner===me&&K.members.length===K.size?`<button class="btn sm" data-cs="${id}">🎲 Lancer le tirage</button>`:""}${K.owner===me?`<button class="btn sm ghost" data-cd="${id}">Supprimer</button>`:""}</div>`
    :K.rounds.map((R,ri)=>`<h4>${RNAME(R.ties.length)}</h4>${R.ties.map((T,ti)=>tieH(id,K,ri,ti,T)).join("")}`).join("")}</div>`).join("")||`<div class="mute" style="font-size:13px">Aucune coupe pour l'instant.</div>`}`;
}

const defiOf=d=>DEFIS[hashS("defi"+d)%DEFIS.length];

const defiOpp=d=>clubTeam(defiClub(d));
function defiState(){ const c=W(); const d=today(); if(!c.dch||c.dch.day!==d){ if(c.dch&&c.dch.done) c.dchPrev=c.dch; c.dch={day:d,formation:"4-3-3",slots:{},done:false}; } return c.dch; }
const bCost=ids=>ids.reduce((s,id)=>s+(BPRICE[cardTier(BY_ID[id])]||0),0);
function defiBoard(d){ const L=[]; for(const id of Object.keys(NAMES)){ const c=C(id)||{}; const x=[c.dch,c.dchPrev].find(z=>z&&z.day===d&&z.done); if(x) L.push({id,s:x.score}); }
  return L.sort((p,q)=>(q.s[0]-q.s[1])-(p.s[0]-p.s[1])||q.s[0]-p.s[0]); }
function claimDefi(){ const c=W(); const y=yday(); if(c.dchWon===y) return; const B=defiBoard(y); if(!B.length) return; c.dchWon=y;
  const gd=r=>r.s[0]-r.s[1]; const best=B.length>=2&&B[0].id===me&&(gd(B[0])>gd(B[1])||(gd(B[0])===gd(B[1])&&B[0].s[0]>B[1].s[0]));
  if(best) grant({pack:"or"},"🎯 Meilleur score du défi d'hier"); else save(); }
function pickDefi(i,role){
  const D=defiState(), df=defiOf(D.day); const used=new Set(Object.values(D.slots)); const cur=D.slots[i];
  const left=df.budget?df.budget-bCost(Object.entries(D.slots).filter(([k])=>+k!==i).map(([,v])=>v)):null;
  const L=PLAYERS.filter(p=>df.f(p)&&(!used.has(p.id)||p.id===cur)).map(p=>({p,f:fit(p,role)})).sort((a,b)=>b.f-a.f||b.p.ovr-a.p.ovr);
  const M=$("#cardModal");
  M.innerHTML=`<div class="cm-box panel" style="max-height:85vh;overflow:auto"><h3 style="margin:0 0 6px">${ROLE_LABEL[role]||role}</h3>${left!=null?`<div class="mute" style="font-size:12px">Budget restant : ${left}</div>`:""}
   <div class="plist">${L.map(({p,f})=>{ const cost=BPRICE[cardTier(p)]; const no=left!=null&&cost>left; return `<button class="prow ${cardTier(p)}" data-dp="${p.id}" ${no?"disabled":""}><b>${Math.round(p.ovr*f)}</b><span>${esc(p.name)}<small>${p.pos.join("/")} · ${p.year}${f<1?" · hors poste":""}</small></span>${left!=null?`<i>${cost}</i>`:""}</button>`; }).join("")}</div>
   <div class="mbtns">${cur?`<button class="btn ghost" id="dpClr">Retirer</button>`:""}<button class="btn ghost" id="dpX">Fermer</button></div></div>`;
  M.classList.add("open"); $("#dpX").onclick=()=>M.classList.remove("open");
  if($("#dpClr")) $("#dpClr").onclick=()=>{ delete D.slots[i]; save(); M.classList.remove("open"); renderJeux(); };
  M.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>{ D.slots[i]=b.dataset.dp; save(); M.classList.remove("open"); renderJeux(); });
}

const QUIZ_MAX=3;
function quizQ(R){
  const pick=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>a.sort(()=>Math.random()-.5);
  const types=["photo","photo","year","goals","nat","pos"]; const ty=pick(types);
  if(ty==="photo"){ const L=PLAYERS.filter(p=>PORTRAITS.has(p.id)); const p=pick(L); const g=LINE[p.pos[0]]||"mid";
    const opts=shuffle([p,...shuffle(PLAYERS.filter(x=>x.id!==p.id&&(LINE[x.pos[0]]||"mid")===g)).slice(0,3)]);
    return {q:"Qui est-ce ?",img:p.id,opts:opts.map(x=>x.name),a:p.name,p}; }
  if(ty==="year"){ const p=pick(PLAYERS); const s=new Set([p.year]); while(s.size<4){ const y=p.year+Math.round((Math.random()-.5)*10); if(y!==p.year&&y>=1998&&y<=2026) s.add(y); }
    return {q:`En quelle année ${p.name} est-il arrivé à l'OL ?`,opts:shuffle([...s].map(String)),a:String(p.year),p}; }
  if(ty==="goals"){ const p=pick(PLAYERS.filter(x=>x.m>=40&&x.g>=3)); const s=new Set([p.g]); let t=0; while(s.size<4&&t++<50){ const v=Math.max(0,p.g+Math.round((Math.random()-.5)*Math.max(10,p.g*.8))); s.add(v); }
    return {q:`Combien de buts ${p.name} a-t-il marqués avec l'OL ?`,opts:shuffle([...s].map(String)),a:String(p.g),p}; }
  if(ty==="nat"){ const p=pick(PLAYERS.filter(x=>NAT[x.id]&&COUNTRY[NAT[x.id]])); const all=[...new Set(Object.values(NAT))].filter(c=>COUNTRY[c]&&c!==NAT[p.id]);
    return {q:`Quelle est la nationalité de ${p.name} ?`,opts:shuffle([NAT[p.id],...shuffle(all).slice(0,3)]).map(c=>flag(c)+" "+COUNTRY[c]),a:flag(NAT[p.id])+" "+COUNTRY[NAT[p.id]],p}; }
  const p=pick(PLAYERS.filter(x=>x.pos[0]!=="GB")); const all=[...new Set(Object.values(ROLE_LABEL))].filter(x=>x!==ROLE_LABEL[p.pos[0]]&&x!=="Gardien");
  return {q:`À quel poste joue principalement ${p.name} ?`,opts:shuffle([ROLE_LABEL[p.pos[0]],...shuffle(all).slice(0,3)]),a:ROLE_LABEL[p.pos[0]],p};
}

let sofa=null; try{ sofa=JSON.parse(localStorage.getItem("onze-ol-sofa")||"null"); }catch(e){}
const sofaSave=()=>{ try{ localStorage.setItem("onze-ol-sofa",JSON.stringify(sofa)); }catch(e){} };
const SOFA_FORM="4-3-3";
function offer5(pool){ const used=new Set(), ids=[]; const pickT=ts=>{ for(const t of ts){ const L=pool.filter(p=>cardTier(p)===t&&!used.has(p.id)); if(L.length) return L[Math.floor(Math.random()*L.length)]; } return null; };
  for(const ts of [["bronze","silver"],["silver","bronze"],["gold","silver"],["icon","gold"],[Math.random()<.25?"myth":"icon","gold","silver"]]){ const p=pickT(ts)||pickT(["bronze","silver","gold","icon","myth"]); if(p){ used.add(p.id); ids.push(p.id); } }
  return ids.sort(()=>Math.random()-.5); }
function sofaOffer(){ const S=sofa; if(S.step>11) return null; if(S.offer&&S.offer.step===S.step) return S.offer;
  const taken=new Set([...S.t[0].ids,...S.t[1].ids]);
  const pool=S.step===11?COACHES.filter(c=>!taken.has(c.id)):PLAYERS.filter(p=>!taken.has(p.id)&&zoneOK(p,F[SOFA_FORM][S.step][0]));
  S.offer={step:S.step,ids:offer5(pool),phase:0,taken:null}; sofaSave(); return S.offer; }
function sofaPick(id){ const S=sofa, O=sofaOffer(); const who=(S.step%2+O.phase)%2; const t=S.t[who];
  if(S.step===11) t.coach=id; else t.slots[S.step]=id; t.ids.push(id);
  if(O.phase===0){ O.phase=1; O.taken=id; } else { S.step++; S.offer=null; } sofaSave(); renderJeux(); }
function sofaPlay(){ const S=sofa; const sides=S.t.map((t,i)=>{ const c={formation:SOFA_FORM,slots:t.slots,bench:{},coach:t.coach}; return {c,S:strength(c,null,false),label:"🛋️ Canapé",owner:null,name:S.n[i]}; });
  const m=buildMatch(sides); sofa=null; sofaSave();
  saveReplay(m); try{ db.collection("onzeol_drafthist").doc(m.id).set({players:[me],names:S.n,mode:"sofa",at:Date.now(),score:m.score,mid:m.id,
    teams:{p0:{formation:SOFA_FORM,slots:S.t[0].slots,coach:S.t[0].coach},p1:{formation:SOFA_FORM,slots:S.t[1].slots,coach:S.t[1].coach}}}); }catch(e){}
  playLocal(m); }

// ---------- 📊 Stats de saison ----------
function statsHTML(){
  const g={},a={},n={},nb={}; let mj=0,v=0,nu=0,d=0,bp=0,bc=0;
  for(const h of matches){ if(!h.owners||!h.st) continue; const i=h.owners.indexOf(me); if(i<0||h.owners[0]===h.owners[1]||!h.st[i]||!h.st[i].g) continue; mj++;
    const [x,y]=i===0?h.score:[h.score[1],h.score[0]]; bp+=x; bc+=y; if(x>y)v++; else if(x<y)d++; else nu++;
    const s=h.st[i]; for(const [p,k] of Object.entries(s.g)) g[p]=(g[p]||0)+k; for(const [p,k] of Object.entries(s.a)) a[p]=(a[p]||0)+k; for(const [p,k] of Object.entries(s.n)){ n[p]=(n[p]||0)+k; nb[p]=(nb[p]||0)+1; } }
  const top=(o,f)=>Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([p,k],i)=>`<div class="nr" onclick="showCard('${p}')"><span>${i+1}. ${esc(BY_ID[p]?.name||"?")}</span><b>${f?f(k,p):k}</b></div>`).join("")||`<div class="mute" style="font-size:12px">—</div>`;
  const avg={}; for(const p in n) if(nb[p]>=2) avg[p]=n[p]/nb[p];
  return `<h3>📊 Mes stats de saison <small>${mj} match${mj>1?"s":""}</small></h3>
  ${mj?`<div class="pstats"><div><b>${v}-${nu}-${d}</b>V-N-D</div><div><b>${bp}</b>buts marqués</div><div><b>${bc}</b>encaissés</div></div>
  <div class="notes"><div><h4>⚽ Buteurs</h4>${top(g)}</div><div><h4>🎯 Passeurs</h4>${top(a)}</div></div><h4>⭐ Meilleures notes (2 matchs min.)</h4>${top(avg,k=>k.toFixed(1))}`:`<div class="mute" style="font-size:13px">Joue des matchs : les buteurs, passeurs et notes s'afficheront ici (à partir de maintenant).</div>`}`;
}

const REACTS=["🔥","😂","😱","😡","👏","⚽"], PHRASES=["Quel but !","Arbitre vendu 😤","C'est plié 😎","Allez l'OL ! 🔴🔵","Remontada ? 👀"];
let reactSeen=Date.now();
async function sendReact(e){ if(!match||match===cpuMatch) return; const mid=match.id; const ref=db.collection("onzeol_meta").doc("react");
  try{ await db.runTransaction(async tx=>{ const d=await tx.get(ref); const x=d.exists?d.data():{}; const L=x.mid===mid?(x.L||[]):[]; L.push({w:me,e,at:Date.now()}); tx.set(ref,{mid,L:L.slice(-20)}); }); }catch(_){} }
function onReact(d){ if(!d||!match||d.mid!==match.id) return; for(const r of d.L||[]){ if(r.at<=reactSeen) continue; reactSeen=r.at; bubble(`${NAMES[r.w]||"?"} : ${r.e}`,r.w===me); } }
function bubble(t,mine){ const el=document.createElement("div"); el.className="rbub"+(mine?" me":""); el.textContent=t; el.style.left=(10+Math.random()*55)+"%"; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }
function renderReactBar(){ const el=$("#mReact"); if(!el) return; const on=mode==="match"&&sharedLive();
  el.style.display=on?"":"none"; if(!on||el.dataset.mid===match.id) return; el.dataset.mid=match.id;
  el.innerHTML=`<div class="rbar">${REACTS.map(e=>`<button data-re="${e}">${e}</button>`).join("")}</div><div class="rbar ph">${PHRASES.map(p=>`<button data-re="${esc(p)}">${esc(p)}</button>`).join("")}</div>`;
  el.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>sendReact(b.dataset.re)); }

let chatRoom=null, chatUnsub=null, chatMsgs=[], chatSeen=0, chatOpen=false;
function chatCtx(){
  if(!db||!me) return null;
  if(mode==="match"&&match&&match!==cpuMatch&&mClosed!==match.id&&!(match.teams||[]).some(t=>t.owner===CPU)) return {room:"m_"+match.id,title:"💬 Chat du match"};
  if(mode==="draft"&&dOpp&&dOpp!==me){ const k=dSub==="budget"?bKey():dKey(); const ex=dSub==="budget"?budgets[k]:drafts[k]; if(ex) return {room:"d_"+k,title:"💬 Chat avec "+(NAMES[dOpp]||"ton adversaire")}; }
  return null; }
const chatDoc=r=>db.collection("onzeol_meta").doc("chat_"+r.replace(/[^\w-]/g,"_"));
function chatTick(){ const c=chatCtx(), fab=$("#chatFab"); if(!fab) return;
  fab.style.display=c&&!chatOpen?"block":"none"; if(!c&&chatOpen) chatClose();
  const room=c?c.room:null; if(room===chatRoom) return;

  $("#chatT").textContent=c.title; let first=true;
  chatUnsub=chatDoc(room).onSnapshot(sn=>{ const L=(sn.exists&&sn.data().L)||[]; let seen=0; try{ seen=+localStorage.getItem("gl_chat_"+room)||0; }catch(_){}
    const fresh=L.filter(m=>m.at>(first?seen:chatLast())&&m.w!==me); chatMsgs=L; first=false;
    if(chatOpen) chatRender(); else { if(fresh.length){ const m=fresh[fresh.length-1]; const el=document.createElement("div"); el.className="cprev"; el.textContent=(NAMES[m.w]||"?")+" : "+m.t; document.body.appendChild(el); setTimeout(()=>el.remove(),4000); } chatBadge(); } },()=>{}); }
function chatLast(){ return chatMsgs.length?chatMsgs[chatMsgs.length-1].at:0; }
function chatBadge(){ const b=$("#chatBadge"); if(!b) return; let seen=0; try{ seen=+localStorage.getItem("gl_chat_"+chatRoom)||0; }catch(_){}
  const n=chatMsgs.filter(m=>m.at>seen&&m.w!==me).length; b.textContent=n>9?"9+":n; b.style.display=n?"block":"none"; }
function chatRender(){ const L=$("#chatL"); L.innerHTML=chatMsgs.map(m=>`<div class="cmsg${m.w===me?" me":""}">${m.w===me?"":`<small>${esc(NAMES[m.w]||"?")}</small>`}${esc(m.t)}</div>`).join("")||`<div class="mute" style="text-align:center;font-size:13px;margin-top:20px">Aucun message. Lance la discussion !</div>`;
  L.scrollTop=L.scrollHeight; try{ localStorage.setItem("gl_chat_"+chatRoom,String(chatLast())); }catch(_){} chatBadge(); }
function chatClose(){ chatOpen=false; $("#chatP").classList.remove("open"); chatTick(); }
async function chatSend(){ const i=$("#chatIn"), t=i.value.trim().slice(0,200); if(!t||!chatRoom) return; i.value="";
  try{ await db.runTransaction(async tx=>{ const ref=chatDoc(chatRoom); const d=await tx.get(ref); const L=(d.exists&&d.data().L)||[]; L.push({w:me,t,at:Date.now()}); tx.set(ref,{L:L.slice(-80)}); }); }catch(e){ toast("Message non envoyé",true); i.value=t; } }

// ---------- 🔄 Mise à jour automatique ----------
const APP_V="2026-11-21c"; // affichage seulement : la détection des mises à jour est automatique
let updShown=false, lastUpdCheck=0, pageTag=null;
// Demande seulement l'en-tête de la page (requête HEAD, quelques octets) : si GitHub a publié une nouvelle
// version, son ETag / date de modification change. Rien à mettre à jour à la main.
// Jamais plus d'une fois par minute, pour ne pas déclencher la limite de requêtes de GitHub Pages.
async function checkUpdate(){ if(updShown) return; const now=Date.now(); if(now-lastUpdCheck<60000) return; lastUpdCheck=now;
  try{ const r=await fetch(location.pathname+"?u="+now,{method:"HEAD",cache:"no-store"}); if(!r.ok) return;
  const tag=r.headers.get("etag")||r.headers.get("last-modified"); if(!tag) return;
  if(pageTag===null){ pageTag=tag; return; } // première vérif : on note la version actuelle
  const m=[0,tag]; if(m[1]!==pageTag){
    // Mise à jour automatique et silencieuse si rien d'important n'est en cours (une seule tentative par version)
    let tried=""; try{ tried=localStorage.getItem("gl_upd_try")||""; }catch(_){}
    const busy=(typeof sharedLive==="function"&&sharedLive())||document.querySelector(".modal.open,.tradeui.open,.tipov");
    if(tried!==m[1]&&!busy){ try{ localStorage.setItem("gl_upd_try",m[1]); }catch(_){} try{ if(typeof dirty!=="undefined"&&dirty) await push(); }catch(_){}
      try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(_){}
      try{ const r=await navigator.serviceWorker?.getRegistration(); await r?.update(); }catch(_){}
      location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+"&t="+Date.now()); return; }
    if(busy&&tried!==m[1]) return; // on réessaiera au prochain contrôle, quand ce sera calme
    updShown=true;
    const el=document.createElement("div"); el.className="tipov"; el.style.zIndex=140; el.innerHTML=`<div class="tipbox"><h3>🆕 Nouvelle version disponible</h3><div class="tipx">L'appli a été mise à jour avec des nouveautés ou des corrections.</div><button class="btn big" id="updGo">Mettre à jour</button></div>`;
    document.body.appendChild(el); el.querySelector("#updGo").onclick=()=>{ location.replace(location.pathname+"?v="+encodeURIComponent(m[1])); }; } }catch(e){} }
try{ document.getElementById("appV").textContent="version "+APP_V; }catch(_){}
setTimeout(checkUpdate,1500); setInterval(checkUpdate,10*60000);
window.addEventListener("pageshow",()=>setTimeout(checkUpdate,500)); window.addEventListener("focus",()=>checkUpdate()); window.addEventListener("online",()=>checkUpdate());
// service worker toujours enregistré : il force le chargement de la dernière version (et sert aux notifications)
try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("firebase-messaging-sw.js?v=2",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}); }catch(e){}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });

    compos[me]=Object.assign(c,{coins:compos[me].coins||300}); await push(); await lref.set({claimed:{[key]:me}},{merge:true});
    toast("Tes compos de l'ancienne version ont été récupérées ✓"); render();
  }catch(e){}
}

  unsubs.push(db.collection("onzeol_cups").onSnapshot(qs=>{ const all={}; qs.forEach(doc=>{ const K=doc.data(); if(K&&K.name) all[doc.id]=K; }); onCups(all); },()=>{}));
  unsubs.push(db.collection("onzeol_meta").doc("react").onSnapshot(snap=>{ if(snap.exists) onReact(snap.data()); },()=>{}));
  unsubs.push(db.collection("onzeol_drafthist").onSnapshot(qs=>{ const L=[]; qs.forEach(doc=>L.push(doc.data())); onDraftHist(L); },()=>{}));
  unsubs.push(db.collection("onzeol_feed").onSnapshot(qs=>{ const L=[]; qs.forEach(doc=>L.push(doc.data())); feed=L.filter(x=>x&&x.text).sort((a,b)=>b.at-a.at).slice(0,60); if(mode==="ligue") renderLigue(); },()=>{}));
  unsubs.push(db.collection("onzeol_meta").doc("main").onSnapshot(snap=>{ const d=snap.exists?snap.data():{}; onMatchData(d.match,d.matches); },()=>{}));
}
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user||user.isAnonymous){
      unsubs.forEach(u=>u()); unsubs=[]; me=null;
      $("#start").style.display="flex"; setSync("Non connecté",""); return;
    }
    me=user.uid; C(me);
    setSync("Connexion…","");
    const uref=db.collection("onzeol_users").doc(me);
    try{
      const s=await uref.get();
      if(s.exists){ const d=s.data(); NAMES[me]=d.name||"?"; compos[me]=norm(d); }
      else { NAMES[me]=pendingName||($("#aName").value.trim())||user.email.split("@")[0]; compos[me]=blank(); compos[me].coins=300; await push(); await importLegacy(NAMES[me]); setTimeout(()=>toast("Bienvenue ! 300 🪙 offertes pour ton premier pack"),800); }
    }catch(e){ setSync("⚠️ Accès refusé : règles Firebase à mettre à jour","err"); }
    pendingName=null; $("#aPass").value="";
    choose(me); startListeners(); setTimeout(()=>{ if(me){ starterPack(); loginStreak(); dailyBonus(); claimRewards(); renderCoins(); badgeLigue(); tip("welcome",()=>starterPrompt(()=>tip("tab_"+mode))); } },1500);
  });
}catch(e){ setSync("⚠️ Synchro indisponible","err"); }
</script>
