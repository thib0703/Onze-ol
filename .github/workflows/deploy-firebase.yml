# Déploie automatiquement les Cloud Functions (notifications push) et les règles Firestore
# à chaque mise à jour de main qui les touche. Lancement manuel possible dans l'onglet Actions.
# Nécessite le secret FIREBASE_SERVICE_ACCOUNT (clé JSON d'un compte de service du projet onze-ol).
name: Déployer Firebase (fonctions + règles)

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Vérifier la clé Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # Contrôle du contenu (sans jamais afficher la clé)
          node -e '
            const fs=require("fs"); let raw=fs.readFileSync(process.argv[1],"utf8").trim();
            raw=raw.replace(/[“”«»]/g,"\"").replace(/[‘’]/g,"\x27");
            if(!raw.startsWith("{")&&raw.startsWith("\"")) raw="{"+raw.replace(/,\s*$/,"")+"}"; // accolades oubliées au copier-coller
            let j; try{ j=JSON.parse(raw); }catch(e){ console.log("::error::Le secret n est pas un JSON valide ("+e.message+"). Longueur "+raw.length+" caractères, commence par "+JSON.stringify(raw.slice(0,1))+", finit par "+JSON.stringify(raw.slice(-1))+". Recolle tout le fichier, de { à }."); process.exit(1); }
            const miss=["type","project_id","private_key","client_email"].filter(k=>!j[k]);
            if(miss.length){ console.log("::error::Champs manquants dans la clé : "+miss.join(", ")); process.exit(1); }
            if(j.type!=="service_account"){ console.log("::error::type="+j.type+" (attendu service_account)"); process.exit(1); }
            if(!/BEGIN PRIVATE KEY/.test(j.private_key)){ console.log("::error::private_key abîmée (copie incomplète ?)"); process.exit(1); }
            fs.writeFileSync(process.argv[1],JSON.stringify(j));
            console.log("Clé OK : "+j.client_email+" (projet "+j.project_id+")");
          ' "$RUNNER_TEMP/sa.json"

      - name: Déployer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project onze-ol --non-interactive --force

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
